<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOURMOUSE // VOICE LAB</title>
<link rel="stylesheet" href="assets/dourmouse-ui.css">
<style>
  @font-face{font-family:'Sekuya';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/sekuya-regular.ttf') format('truetype');}
  @font-face{font-family:'Orbitron';font-style:normal;font-weight:700;font-display:swap;src:url('assets/fonts/orbitron-700-latin.woff2') format('woff2');}
  @font-face{font-family:'Orbitron';font-style:normal;font-weight:900;font-display:swap;src:url('assets/fonts/orbitron-900-latin.woff2') format('woff2');}
  @font-face{font-family:'Rajdhani';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/rajdhani-500-latin.woff2') format('woff2');}
  @font-face{font-family:'Rajdhani';font-style:normal;font-weight:600;font-display:swap;src:url('assets/fonts/rajdhani-600-latin.woff2') format('woff2');}
  @font-face{font-family:'Rajdhani';font-style:normal;font-weight:700;font-display:swap;src:url('assets/fonts/rajdhani-700-latin.woff2') format('woff2');}
  @font-face{font-family:'Share Tech Mono';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/share-tech-mono-400-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/space-grotesk-400-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/space-grotesk-500-latin.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url('assets/fonts/space-grotesk-600-latin.woff2') format('woff2');}
  /* v13.6: real Fira Sans, bundled locally (OFL-licensed) — takes over
     --font-prose below from Space Grotesk. */
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/fira-sans-400-latin.woff2') format('woff2');}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/fira-sans-500-latin.woff2') format('woff2');}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;font-display:swap;src:url('assets/fonts/fira-sans-600-latin.woff2') format('woff2');}
  /* Retheme to the shared terminal-IDE design system (assets/dourmouse-ui.css,
     linked above). Same method as ui/workspace.html: variable NAMES unchanged,
     so all 92 call sites keep working and this is one block to revert.

     This was the most heavily decorated screen in the app -- a glowing
     radial-gradient sphere, four alpha rings, five separate box-shadow
     halos, two text glows and a keyframe animation that animated box-shadow
     itself. What survives and why:

       - The ORB stays, and stays round and state-coloured: it is the actual
         control ("tap the orb and talk") and its colour is the only place
         idle / listening / thinking / speaking is shown. What goes is the
         radial-gradient sphere shading and every halo -- it is a flat solid
         disc now, on the system's own accent tokens.
       - The MIC button stays round too. These two, the status dots and an
         account avatar are the only circles in the app: they are circular
         *targets*, not pill chrome. Every rectangular control on this page
         went to the system's 2px corner.
       - --cyan/--gold stop being hues: cyan becomes the neutral primary
         text, gold folds into the single amber accent.
       - --line was #182435, a blue-black; --panel was #0c1220. Solid layer
         colours now.
       - --text-body is NEW (additive) so transcript prose stops being
         rgba(219,228,240,.72) over a panel.
       - Type: Departure Mono for structure (--font-hud), Monaspace Neon for
         everything the machine says, transcripts included. Rajdhani, Share
         Tech Mono and Space Grotesk are no longer referenced by any rule;
         their @font-face blocks are left in place above rather than deleted,
         since they are shared with the other screens' asset set.

     Previous values, for a one-step revert:
       --bg:#070b12; --panel:#0c1220; --line:#182435;
       --cyan:#22d3ee/34,211,238; --gold:#f5c86a/245,200,106;
       --text:#dbe4f0; --dim:#64748b; --red:#f87171; --green:#5ee7a0;
       --font-hud:'Rajdhani'...; --font-mono:'Share Tech Mono'...;
       --font-prose:'Fira Sans'...                                        */
  :root {
    --bg: #09090B;
    --panel: #18181B;
    --raised: #27272A;
    --line: #27272A;
    --line-2: #3F3F46;
    --cyan: #FAFAFA;
    --cyan-rgb: 250, 250, 250;
    --gold: #F59E0B;
    --gold-rgb: 245, 158, 11;
    --text: #FAFAFA;
    --text-body: #A1A1AA;
    --dim: #71717A;
    --red: #EF4444;
    --green: #10B981;
    --font-hud: 'Departure Mono','Commit Mono','Intel One Mono',ui-monospace,monospace;
    --font-mono: 'Berkeley Mono','Monaspace Neon','JetBrains Mono NL','JetBrains Mono',ui-monospace,Menlo,monospace;
    --font-prose: 'Berkeley Mono','Monaspace Neon','JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font-prose);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  /* ---------- top bar ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--font-hud); font-size: 16px; letter-spacing: .16em; white-space: nowrap; }
  .brand .shield { width: 18px; height: 18px; color: var(--dim); flex: none; }
  .brand b { color: var(--text); font-weight: 400; }
  .brand .dot { color: var(--gold); }
  .brand .sub { color: var(--dim); font-size: 11px; letter-spacing: .24em; font-family: var(--font-mono); }
  /* Horizontal readout row. It had no width discipline, so a long backend
     or voice name pushed the later chips (and the auth button) off the end
     of the bar with no way to reach them. House fix. */
  .topchips { display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
    flex: 1 1 auto; min-width: 0; justify-content: flex-end;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 32px, #000 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 32px, #000 100%); }
  .topchips::-webkit-scrollbar { display: none; }
  .chip { display: flex; align-items: center; gap: 7px; color: var(--dim); flex: none; white-space: nowrap; }
  /* Status is a solid 6px dot -- the 8px coloured halos are gone. */
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
  .chip .dot.on { background: var(--green); }
  .chip .dot.err { background: var(--red); }
  .chip b { color: var(--text); font-weight: 400; }
  .authbtn {
    background: var(--raised); color: var(--text); border: 1px solid var(--line-2); border-radius: 2px;
    padding: 6px 14px; font-family: var(--font-hud); font-size: 12px; font-weight: 500; letter-spacing: .08em;
    cursor: pointer; flex: none; white-space: nowrap;
    transition: background-color .18s ease, color .18s ease;
  }
  .authbtn:hover { background: var(--line-2); }
  .authbtn.ok { background: var(--panel); color: var(--dim); border-color: var(--line); }

  /* ---------- stage ---------- */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .stage {
    display: flex; align-items: center; justify-content: center; gap: 34px;
    padding: 18px 24px 10px; flex-wrap: wrap;
  }
  .statusline { text-align: center; }
  .statusline .kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: .34em; color: var(--dim); }
  .statusline .big { font-family: var(--font-hud); font-size: 21px; font-weight: 600; letter-spacing: .22em; color: var(--text);
    margin-top: 4px; white-space: nowrap; }

  /* ---------- orb ---------- */
  .radar { position: relative; width: 220px; height: 220px; flex: none; }
  /* Four concentric rules, solid, at the structural line colour instead of
     a 16%-to-8% alpha cyan fade. */
  .radar .ring { position: absolute; border: 1px solid var(--line); border-radius: 50%; }
  .radar .r1 { inset: 0; }
  .radar .r2 { inset: 28px; }
  .radar .r3 { inset: 56px; }
  .radar .r4 { inset: 84px; }
  /* The orb was a shaded sphere (four-stop radial gradient) wearing a 44px
     halo, and every state swapped the sphere for a differently-shaded one
     with a bigger halo. It is now a flat solid disc: state is the fill
     colour, full stop. The breathing animation stays because it animates
     transform only. */
  .orb {
    position: absolute; inset: 58px; border-radius: 50%;
    background: var(--raised); border: 1px solid var(--line-2);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  .radar.listening .orb { animation: breathfast .7s ease-in-out infinite; background: var(--cyan); border-color: var(--cyan); }
  @keyframes breathfast { 0%,100% { transform: scale(1.02); } 50% { transform: scale(1.1); } }
  .radar.listening .ring { border-color: var(--line-2); }
  .radar.think .orb { background: var(--gold); border-color: var(--gold); }
  .radar.speak .orb { background: var(--green); border-color: var(--green); }

  /* ---------- mic ---------- */
  .micwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }
  .micbtn {
    width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--line-2);
    background: var(--panel); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .18s ease, transform .18s ease;
  }
  .micbtn:hover { background: var(--raised); }
  .micbtn:active { transform: scale(.94); }
  /* Recording was signalled by a keyframe that animated box-shadow -- a
     property that cannot be composited. Solid red fill plus an opacity
     pulse says the same thing and stays on the compositor. */
  .micbtn.rec {
    background: var(--red); border-color: var(--red); color: var(--bg);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .micbtn svg { width: 24px; height: 24px; }
  .miclabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: .3em; color: var(--dim); }
  .miclabel.hot { color: var(--gold); }

  /* ---------- deck: transcript + profile ---------- */
  .deck { flex: 1; display: grid; grid-template-columns: 1fr 250px; gap: 14px; padding: 0 24px 18px; min-height: 0; }
  .convo {
    background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
    overflow-y: auto; padding: 14px 16px; min-height: 0;
    font-size: 13.5px; line-height: 1.6;
  }
  .convo:empty::before { content: "TAP THE ORB AND TALK — WATCH DOURMOUSE THINK, ACT, THEN REPLY."; color: var(--dim); font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; display: block; text-align: center; margin-top: 30px; }
  .turn { margin-bottom: 16px; }
  .tq { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .tq .who { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .26em; color: var(--dim); flex: none; }
  .tq .q { color: var(--text); }
  .th { border-left: 2px solid var(--line-2); padding: 4px 0 4px 12px; margin: 4px 0 8px; }
  .th-head { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .24em; color: var(--gold); margin-bottom: 4px; }
  .th-line { font-size: 12.5px; color: var(--text-body); margin: 2px 0; }
  .th-line .caret { display: inline-block; width: 6px; height: 12px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  .ac { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; margin: 3px 0; color: var(--text); }
  /* One monochrome pill for every tool tag -- the ".done" variant no longer
     recolours the pill; the status word beside it already says DONE. */
  .ac .tag { flex: none; font-size: 9px; letter-spacing: .12em; padding: 2px 6px; border: 1px solid transparent; border-radius: 2px; background: var(--raised); color: var(--dim); }
  .ac .nm { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
  .ac .st { margin-left: auto; flex: none; color: var(--dim); font-size: 9.5px; letter-spacing: .16em; }
  .ac.done .st { color: var(--green); }
  .ac.done .tag { color: var(--dim); }
  .ac .snip { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
  .rep { border-left: 2px solid var(--gold); padding: 4px 0 4px 12px; margin-top: 8px; }
  .rp-head { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .24em; color: var(--dim); margin-bottom: 4px; }
  .rp-head .voice { color: var(--dim); letter-spacing: .14em; }
  .rp-body { white-space: pre-wrap; }
  .rp-body .caret { display: inline-block; width: 7px; height: 14px; background: var(--gold); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  .err { color: var(--red); font-size: 12.5px; }
  @keyframes blink { 50% { opacity: 0; } }

  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; }
  .card .k { font-family: var(--font-hud); font-size: 9.5px; letter-spacing: .26em; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; }
  .card .row { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); padding: 4px 0; border-bottom: 1px solid var(--line); }
  .card .row:last-of-type { border-bottom: 0; }
  .card .row b { color: var(--text); font-weight: 400; }
  .card .note { font-size: 11px; color: var(--dim); line-height: 1.5; margin-top: 8px; }
  .qbtn {
    width: 100%; margin-top: 10px; background: var(--panel); color: var(--text-body);
    border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px;
    font-family: var(--font-hud); font-size: 11px; font-weight: 500; letter-spacing: .12em; cursor: pointer;
    white-space: nowrap;
    transition: background-color .18s ease, color .18s ease, border-color .18s ease;
  }
  .qbtn:hover { background: var(--raised); color: var(--text); border-color: var(--line-2); }
  .qbtn:disabled { opacity: .5; cursor: default; }

  #authnote {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line-2); color: var(--red);
    font-size: 12.5px; padding: 8px 16px; border-radius: 2px; display: none; z-index: 5;
  }
  #authnote a { color: var(--gold); }
  @media (max-width: 860px) {
    .deck { grid-template-columns: 1fr; }
    .side { flex-direction: row; flex-wrap: wrap; }
    .card { flex: 1; min-width: 200px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
    <div><b>DOURMOUSE<span class="dot">.</span></b> <span class="sub">// VOICE LAB</span></div>
  </div>
  <div class="topchips">
    <span class="chip"><span class="dot" id="sttDot"></span>STT&nbsp;<b id="sttName">…</b></span>
    <span class="chip"><span class="dot" id="ttsDot"></span>TTS&nbsp;<b id="ttsName">…</b></span>
    <span class="chip"><span class="dot" id="memDot"></span>MEM&nbsp;<b id="memCount">…</b></span>
    <button class="authbtn" id="authBtn">INITIALIZE AUTH</button>
  </div>
</header>

<main>
  <div id="authnote"></div>
  <div class="stage">
    <div class="statusline">
      <div class="kicker">SYSTEM STATUS</div>
      <div class="big" id="sysStatus">INITIALIZING</div>
    </div>
    <div class="radar" id="radar">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
      <div class="orb"></div>
    </div>
    <div class="micwrap">
      <button class="micbtn" id="micBtn" title="Tap to command">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
      <div class="miclabel" id="micLabel">TAP TO COMMAND</div>
    </div>
  </div>

  <div class="deck">
    <div class="convo" id="convo"></div>
    <aside class="side">
      <div class="card">
        <div class="k">VOICE PROFILE</div>
        <div class="row"><span>SAMPLES</span><b id="profSamples">0</b></div>
        <div class="row"><span>ACCENT MATCH</span><b>ADAPTING</b></div>
        <div class="row"><span>STT ENGINE</span><b id="profStt">—</b></div>
        <div class="row"><span>TTS ENGINE</span><b id="profTts">—</b></div>
        <div class="note">Every conversation is a training signal. Queue this session and your corrections feed the next SFT dataset build for the dourmouse fine-tune.</div>
        <button class="qbtn" id="queueBtn">QUEUE SESSION FOR FINE-TUNE</button>
      </div>
    </aside>
  </div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const radar = $('radar'), micBtn = $('micBtn'), micLabel = $('micLabel'), convo = $('convo');

/* ---------- status ---------- */
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) throw Object.assign(new Error('auth'), {auth: true});
  return r;
}
async function loadStatus() {
  try {
    const [v, m, t] = await Promise.all([
      api('/api/voice').then(r => r.json()),
      api('/api/memory').then(r => r.json()).catch(() => ({})),
      api('/api/telemetry').then(r => r.json()).catch(() => ({})),
    ]);
    const sttOk = v.stt === 'faster-whisper';
    const ttsOk = v.tts !== 'not-configured';
    dot('sttDot', sttOk ? 'on' : 'err'); $('sttName').textContent = sttOk ? 'WHISPER' : (v.stt || 'OFF').toUpperCase();
    dot('ttsDot', ttsOk ? 'on' : 'err'); $('ttsName').textContent = ttsOk ? (v.tts || '?').toUpperCase() : 'OFF';
    dot('memDot', 'on'); $('memCount').textContent = m.count != null ? m.count : '—';
    $('sysStatus').textContent = (sttOk && ttsOk) ? 'SYSTEM READY' : (sttOk ? 'SYSTEM READY · TTS OFF' : 'VOICE NOT CONFIGURED');
    $('profStt').textContent = (v.whisper_model || '—').toUpperCase();
    $('profTts').textContent = (v.piper_voice || (v.tts || '—')).toUpperCase();
    $('authBtn').textContent = 'AUTHENTICATED'; $('authBtn').classList.add('ok');
  } catch (e) {
    if (e.auth) {
      $('sysStatus').textContent = 'AUTH REQUIRED';
      $('authnote').style.display = 'block';
      $('authnote').innerHTML = 'Not authenticated — <a href="/login">log in first</a>, then reload.';
    } else {
      $('sysStatus').textContent = 'VOICE OFFLINE';
      $('authnote').style.display = 'block';
      $('authnote').textContent = 'Status unavailable: ' + e.message;
    }
  }
}
function dot(id, cls) { const d = $(id); d.className = 'dot' + (cls === 'on' ? ' on' : cls === 'err' ? ' err' : ''); }

/* ---------- recording ---------- */
let mediaRec = null, chunks = [], stream = null, recording = false;

async function toggleMic() {
  if (recording) { stopRecording(); return; }
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('microphone not available in this browser');
    }
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    mediaRec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mediaRec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' });
      transcribe(blob);
    };
    mediaRec.start();
    recording = true;
    setRec(true);
  } catch (e) {
    addTurn('Mic error: ' + e.message, true);
  }
}
function stopRecording() {
  try { mediaRec && mediaRec.state !== 'inactive' && mediaRec.stop(); } catch (_) {}
  recording = false; setRec(false);
}
function setRec(on) {
  micBtn.classList.toggle('rec', on);
  micLabel.textContent = on ? 'LISTENING… TAP TO STOP' : 'TAP TO COMMAND';
  micLabel.classList.toggle('hot', on);
  radar.classList.toggle('listening', on);
}
function setState(mode) {
  radar.classList.toggle('listening', mode === 'listen');
  radar.classList.toggle('think', mode === 'think');
  radar.classList.toggle('speak', mode === 'speak');
  if (mode) $('sysStatus').textContent = mode === 'think' ? 'THINKING…' : mode === 'speak' ? 'SPEAKING…' : 'SYSTEM READY';
}

/* ---------- transcript ---------- */
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function addTurn(question, isErr) {
  const turn = el(
    '<div class="turn"><div class="tq"><span class="who">YOU</span><span class="q"></span></div>' +
    '<div class="proc"><div class="th" style="display:none"><div class="th-head">[T] REASONING</div><div class="th-lines"></div></div>' +
    '<div class="acts" style="display:none"></div>' +
    '<div class="rep" style="display:none"><div class="rp-head">DOURMOUSE <span class="voice">VOICE REPLY · TTS</span></div><div class="rp-body"></div></div></div></div>'
  );
  if (isErr) turn.querySelector('.q').innerHTML = '<span class="err">' + esc(question) + '</span>';
  else turn.querySelector('.q').textContent = question;
  convo.appendChild(turn);
  convo.scrollTop = convo.scrollHeight;
  return {
    th: turn.querySelector('.th'), thLines: turn.querySelector('.th-lines'),
    acts: turn.querySelector('.acts'), rep: turn.querySelector('.rep'), rpBody: turn.querySelector('.rp-body'),
    tools: {}, // name -> {row, st}
  };
}

/* ---------- transcribe -> chat (streaming) -> speak ---------- */
async function transcribe(blob) {
  setState('listen'); $('sysStatus').textContent = 'HEARING…';
  try {
    const r = await api('/api/speech', { method: 'POST', body: blob });
    const d = await r.json();
    const text = (d.text || '').trim();
    if (!text) { addTurn('…(no speech detected)', true); setState(null); return; }
    await ask(text);
  } catch (e) {
    addTurn(e.auth ? 'Login required — /login' : 'STT failed: ' + e.message, true);
    setState(null);
  }
}

async function ask(prompt) {
  const turn = addTurn(prompt);
  setState('think');
  let finalText = '';
  // Claude-style: the reasoning phase is ALWAYS visible before the reply —
  // real plan steps stream in when the dispatcher emits them, and the
  // placeholder keeps the thinking block present for quick turns.
  turn.th.style.display = '';
  const pre = el('<div class="th-line">Reasoning through the request…</div>');
  turn.thLines.appendChild(pre);
  try {
    const r = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // voice: true -- this UI transcribes the request and speaks the
      // reply back with no human review in between (see ask()/speak()
      // below), so the server shapes the reply for being heard, not read.
      body: JSON.stringify({ prompt, voice: true }),
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let thinkingStarted = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) !== -1) {
        const raw = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!raw.startsWith('data:')) continue;
        let evt; try { evt = JSON.parse(raw.slice(5).trim()); } catch (_) { continue; }
        handleEvent(turn, evt);
      }
    }
    function handleEvent(t, evt) {
      switch (evt.type) {
        case 'plan': {
          // Claude-style thinking: the plan streams in BEFORE the reply.
          t.th.style.display = '';
          thinkingStarted = true;
          // drop the placeholder once real reasoning arrives
          t.thLines.innerHTML = '';
          const steps = Array.isArray(evt.steps) ? evt.steps : [];
          steps.forEach(s => {
            const n = (s && (s.n != null ? s.n + '. ' : '')) + (s && s.task ? s.task : String(s));
            const line = el('<div class="th-line"></div>');
            line.textContent = n;
            t.thLines.appendChild(line);
          });
          if (!steps.length) {
            const line = el('<div class="th-line"><span class="caret"></span></div>');
            t.thLines.appendChild(line);
          }
          convo.scrollTop = convo.scrollHeight;
          break;
        }
        case 'tool_use': {
          // visible web-search / tool actions with running → done ticks
          t.acts.style.display = '';
          const name = evt.name || 'tool';
          const row = el('<div class="ac"><span class="tag">[RUN]</span><span class="nm"></span><span class="st">RUNNING…</span></div>');
          row.querySelector('.nm').textContent = name + (evt.raw_arguments ? ' ' + String(evt.raw_arguments).slice(0, 60) : '');
          t.acts.appendChild(row);
          t.tools[name] = row;
          convo.scrollTop = convo.scrollHeight;
          break;
        }
        case 'tool_result': {
          const row = t.tools[evt.name];
          if (row) {
            row.classList.add('done');
            row.querySelector('.st').textContent = '✓ DONE';
            const snip = String(evt.text || '').replace(/\s+/g, ' ').slice(0, 70);
            if (snip) {
              const s = el('<span class="snip"></span>');
              s.textContent = snip;
              row.appendChild(s);
            }
          }
          break;
        }
        case 'assistant_delta': {
          if (evt.text) { finalText += evt.text; renderReply(t, finalText, false); }
          break;
        }
        case 'assistant_text': {
          if (evt.text) { finalText = evt.text; renderReply(t, finalText, false); }
          break;
        }
        case 'brain': {
          if (evt.model) $('brainVal') && ($('brainVal').textContent = String(evt.model).toUpperCase());
          break;
        }
      }
    }
    finalText = finalText.trim();
    if (finalText) {
      renderReply(turn, finalText, true);
      speak(finalText);
    } else if (!turn.tools && !turn.thLines.children.length) {
      addTurn('No response received.', true);
    }
    setState(null);
    bumpSamples();
  } catch (e) {
    setState(null);
    addTurn(e.auth ? 'Login required — /login' : 'Chat failed: ' + e.message, true);
  }
}

function renderReply(t, text, final) {
  t.rep.style.display = '';
  t.rpBody.innerHTML = esc(text) + (final ? '' : '<span class="caret"></span>');
  convo.scrollTop = convo.scrollHeight;
}
function speak(text) {
  setState('speak');
  const url = '/api/speech?text=' + encodeURIComponent(text.slice(0, 600));
  const a = new Audio(url);
  a.onerror = () => { setState(null); };
  a.onended = () => { setState(null); };
  a.play().catch(() => { setState(null); });
}

/* ---------- voice profile (local) ---------- */
let sampleCount = Number(localStorage.getItem('dm_voice_samples') || 0);
let queueCount = Number(localStorage.getItem('dm_voice_queue') || 0);
$('profSamples').textContent = sampleCount;
function bumpSamples() {
  sampleCount += 1;
  localStorage.setItem('dm_voice_samples', String(sampleCount));
  $('profSamples').textContent = sampleCount;
}
$('queueBtn').addEventListener('click', () => {
  queueCount += 1;
  localStorage.setItem('dm_voice_queue', String(queueCount));
  const b = $('queueBtn');
  b.disabled = true; b.textContent = 'QUEUED · ' + queueCount + ' SESSION(S)';
  setTimeout(() => { b.disabled = false; b.textContent = 'QUEUE SESSION FOR FINE-TUNE'; }, 2000);
});

$('authBtn').addEventListener('click', () => { location.href = '/login'; });
micBtn.addEventListener('click', toggleMic);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopRecording(); });
loadStatus();
</script>
