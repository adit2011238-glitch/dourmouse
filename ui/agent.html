<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOURMOUSE // AGENT WINDOW</title>
<link rel="stylesheet" href="/assets/dourmouse-ui.css">
<style>
  /* v13.6: real Fira Sans, bundled locally (ui/assets/fonts/, OFL-licensed)
     — see dourmouse_universe.md for the "polish for final app" pass this
     belongs to. Replaces --font-prose's previous "Inter" entry below,
     which was never actually bundled anywhere in this codebase (Inter
     isn't a macOS system font either, so it silently fell through to
     -apple-system on every real machine) — this is a genuine fix, not
     just a rename. Absolute /assets/ path (not relative) because this
     page is served at the nested route /agent/<name>. */
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:300;font-display:swap;
    src:url('/assets/fonts/fira-sans-300-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;font-display:swap;
    src:url('/assets/fonts/fira-sans-400-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:italic;font-weight:400;font-display:swap;
    src:url('/assets/fonts/fira-sans-400-italic-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:500;font-display:swap;
    src:url('/assets/fonts/fira-sans-500-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;font-display:swap;
    src:url('/assets/fonts/fira-sans-600-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('/assets/fonts/fira-sans-700-latin.woff2') format('woff2')}
  /* Retheme to the shared terminal-IDE design system (assets/dourmouse-ui.css,
     linked above). Same method as ui/workspace.html: the variable NAMES are
     unchanged on purpose, so all 108 call sites in this file keep working and
     the whole look is one block to revert.

     What actually changed, and why:

       - --text/--text-dim/--line/--line-strong were rgba(cyan) over the
         ground. Cyan-tinted "white" text and cyan hairlines are what made
         this page read as a sci-fi HUD rather than a tool. They are now the
         four solid neutral text/line values.
       - --panel was rgba(18,21,30,.72): an alpha fill, so every header and
         card composited the page through itself. It is now a flat layer.
       - --raised is NEW (additive, nothing renamed): the interactive/hover
         layer the old palette had no name for, so selected rows could stop
         being a 6%-alpha cyan haze.
       - --cyan stops being a hue at all and becomes the neutral text colour;
         amber survives as the single active accent, red as error. --gold
         collapses into amber — two near-identical warm hues were doing one
         job.
       - The alpha ladder (--a06 … --a85) is kept and still defined because
         a few opacity/animation call sites read it, but no surface is
         composited from it any more.
       - Type goes mono-first: Departure Mono carries structure (headings,
         chrome, the wordmark), Monaspace Neon carries everything the machine
         says, prose included.

     Previous values, for a one-step revert:
       --ground:#0B0E14; --surface:#12151E;
       --cyan:#4FC3F7/79,195,247; --amber:#F5A623/245,166,35;
       --red:#EF5350/239,83,80; --gold:#FFD232/255,210,50;
       --dead:#8A929E/138,146,158;
       --text:rgba(cyan,.85); --text-dim:rgba(cyan,.45);
       --line:rgba(cyan,.10); --line-strong:rgba(cyan,.30);
       --panel:rgba(18,21,30,0.72);
       --font-display:"Exo 2"...; --font-mono:"JetBrains Mono"...;
       --font-prose:"Fira Sans"...; --font-wordmark:"Orbitron"...          */
  :root {
    --ground: #09090B;
    --surface: #18181B;
    --raised: #27272A;
    --cyan:  #FAFAFA; --cyan-rgb:  250,250,250;
    --amber: #F59E0B; --amber-rgb: 245,158,11;
    --red:   #EF4444; --red-rgb:   239,68,68;
    --gold:  #F59E0B; --gold-rgb:  245,158,11;
    --dead:  #52525B; --dead-rgb:  82,82,91;
    --a06: 0.06; --a10: 0.10; --a16: 0.16; --a22: 0.22;
    --a30: 0.30; --a45: 0.45; --a60: 0.60; --a85: 0.85;
    /* ---- type ---- */
    --font-display:  'Departure Mono','Commit Mono','Intel One Mono',ui-monospace,monospace;
    --font-mono:     'Berkeley Mono','Monaspace Neon','JetBrains Mono NL','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --font-prose:    'Berkeley Mono','Monaspace Neon','JetBrains Mono',ui-monospace,monospace;
    --font-wordmark: 'Departure Mono','Commit Mono','Intel One Mono',ui-monospace,monospace;
    /* ---- semantic aliases ---- */
    --text: #FAFAFA;
    --text-dim: #71717A;
    --line: #27272A;
    --line-strong: #3F3F46;
    --panel: #18181B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* The two radial washes that used to bleed cyan out of two corners are
     gone -- pure decoration, and the single most recognisable "generated by
     an AI" tell. The ground is one flat colour. */
  body {
    background: var(--ground);
    color: var(--text);
    font-family: var(--font-mono);
    overflow: hidden;
  }
  /* The CRT scanline film (a 1.4%-alpha overlay with mix-blend-mode over the
     entire page) is gone with its <div>. It is set dressing, and it is the
     kind of translucent full-screen layer the design system exists to
     forbid. */
  #app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

  /* ---------------- header ---------------- */
  #hdr {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  #hdr .title {
    font-family: var(--font-display); font-weight: 100;
    font-size: 15px; letter-spacing: 0.22em; color: var(--text);
    white-space: nowrap;
  }
  #hdr .sub { font-size: 8px; letter-spacing: 0.10em; font-weight: 300; color: var(--text-dim); }
  #hdr .spacer { flex: 1; }
  #hdr a { color: var(--text-dim); text-decoration: none; font-size: 10px; letter-spacing: 0.06em; border: 1px solid var(--line); padding: 7px 12px; transition: color 200ms, border-color 200ms; }
  #hdr a:hover { color: var(--text); border-color: var(--line-strong); }
  #agentname { color: var(--text); font-size: 14px; font-weight: 600; letter-spacing: 0.06em; white-space: nowrap; }
  #agentdomain { color: var(--text-dim); font-size: 8px; letter-spacing: 0.10em; font-weight: 300; }
  #pill { padding: 6px 12px; font-size: 9px; letter-spacing: 0.06em; font-weight: 400; border: 1px solid var(--line); color: var(--text-dim); }
  /* The three status halos are gone. State is carried by ground, border and
     the one accent -- an opacity pulse is still fine (it animates opacity
     only, never a layout property). */
  #pill.computing { color: var(--text); background: var(--raised); border-color: var(--line-strong); animation: pulse 1s ease-in-out infinite; }
  #pill.auth { color: var(--amber); border-color: var(--line-strong); animation: blink 0.8s steps(2, start) infinite; }
  #pill.live { color: var(--text); background: var(--raised); border-color: var(--line-strong); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes blink { 50% { opacity: 0.3; } }

  /* ---------------- body ---------------- */
  #body { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  #desc { color: var(--text-dim); font-size: 11px; font-weight: 300; line-height: 1.6; border-left: 2px solid var(--line-strong); padding-left: 12px; }
  #model { color: var(--text-dim); font-size: 9px; font-weight: 300; letter-spacing: 0.06em; margin-top: 8px; padding-left: 14px; }

  .sec { font-size: 9px; letter-spacing: 0.13em; font-weight: 400; color: var(--text-dim); margin: 2px 0 8px; }

  /* ---------------- toolkit ---------------- */
  #tools { display: flex; flex-wrap: wrap; gap: 8px; }
  /* One monochrome chip. The two coloured variants are KEPT deliberately and
     are not "badge palette": the chip's text is only the tool name (the JS
     puts the permission in `title`), so colour is the sole at-a-glance signal
     that a tool is gated or prohibited. That is system state, not a tag --
     it now uses the system's own accent/error tokens on the same monochrome
     ground as every other chip. */
  .tchip { padding: 5px 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text-dim); font-family: var(--font-mono); font-size: 10px; font-weight: 400; }
  .tchip.gated { border-color: var(--line-strong); color: var(--amber); }
  .tchip.prohib { border-color: var(--line-strong); color: var(--red); }

  /* ---------------- dispatch ---------------- */
  #dispatch { border: 1px solid var(--line); background: var(--panel); padding: 14px; }
  #dinput {
    width: 100%; padding: 10px 12px; resize: none;
    border: 1px solid var(--line); background: var(--ground);
    color: var(--text); font-family: var(--font-mono); font-size: 12px; font-weight: 400; outline: none;
  }
  #dinput:focus { border-color: var(--line-strong); }
  #drow { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  #dsend { padding: 8px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-family: var(--font-display); font-size: 10px; letter-spacing: 0.06em; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background-color 200ms, color 200ms, border-color 200ms; }
  #dsend:hover:not(:disabled) { background: var(--raised); color: var(--text); border-color: var(--line-strong); }
  #dsend:disabled { opacity: 0.45; cursor: default; }
  #dstatusline { color: var(--text-dim); font-size: 10px; font-weight: 300; }

  /* ---------------- live feed ---------------- */
  #feedwrap { flex: 1; min-height: 160px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
  #feed { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  .fe { font-size: 10px; font-weight: 300; line-height: 1.5; word-break: break-word; }
  .fe .ts { color: var(--text-dim); font-size: 9px; }
  /* One pill, monochrome, for every feed tag. The four cyan-bordered
     variants were already the same colour as each other -- they are now a
     single rule. Only .auth keeps an accent, because a permission prompt is
     system state the operator has to act on. */
  .fe .tag { font-size: 8px; letter-spacing: 0.06em; font-weight: 500; padding: 1px 6px; margin: 0 6px 0 4px;
    background: var(--raised); color: var(--text-dim); border: 1px solid transparent; }
  .fe.auth .tag { background: var(--raised); color: var(--amber); border-color: var(--line-strong); }
  .fe.live { border-left: 2px solid var(--line-strong); }
  .fe.msg { border-left: 2px solid var(--line-strong); background: var(--raised); }
  #inboxwrap { flex: 1; min-height: 120px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
  /* "new mail" used to be a cyan glow pulse. It is now an opacity flash on
     an accent border -- same signal, no halo, and still transform/opacity
     only so it cannot force layout. */
  #inboxwrap.flash { animation: inboxflash 1.2s ease-out; border-color: var(--amber); }
  @keyframes inboxflash { 0%, 40% { opacity: 0.55; } 100% { opacity: 1; } }
  #inbox { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  #inboxempty { color: var(--text-dim); font-size: 10px; font-weight: 300; }
  .fe .tool { color: var(--text); font-weight: 600; }
  .fe .args { color: var(--text-dim); }
  #empty { color: var(--text-dim); font-size: 10px; font-weight: 300; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--raised); }
  ::-webkit-scrollbar-track { background: var(--ground); }
  /* phone-friendly layout — single column, touch-sized controls. */
  @media (max-width: 640px) {
    #body { padding: 12px; }
    #drow { flex-wrap: wrap; }
    #directive { font-size: 14px; min-height: 44px; }
    .nchip { min-height: 34px; }
    .keyhint { display: none; }
  }

  /* reduced motion — freeze rotation and pulse, keep alpha states and glyphs */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <span class="title">◈ DOURMOUSE</span>
    <span class="sub">// AGENT LIVE WINDOW</span>
    <div class="spacer"></div>
    <span id="agentname">…</span>
    <span id="agentdomain">…</span>
    <span id="pill">[IDLE]</span>
    <a href="/" id="tomain">⧉ DASHBOARD</a>
    <a href="/map" id="tomap">⧉ MAP</a>
  </div>
  <div id="body">
    <div id="desc">loading…</div>
    <div id="model">MODEL: …</div>
    <div class="sec">TOOLKIT</div>
    <div id="tools"></div>
    <div class="sec">DISPATCH DIRECTIVE</div>
    <div id="dispatch">
      <textarea id="dinput" rows="2" placeholder="Send a task to this agent…"></textarea>
      <div id="drow">
        <button id="dsend">[SEND_DIRECTIVE]</button>
        <div id="dstatusline"></div>
      </div>
    </div>
    <div class="sec">LIVE ACTIVITY FEED</div>
    <div id="feedwrap"><div id="feed"><div class="fe" id="empty">awaiting first activity…</div></div></div>
    <div class="sec">INBOX // INTER-AGENT COMMS <span id="inboxcount" style="color:var(--text)"></span></div>
    <div id="inboxwrap"><div id="inbox"><div class="fe" id="inboxempty">no messages yet</div></div></div>
  </div>
</div>
<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Agent name comes from the URL: /agent/<name>
const agentName = decodeURIComponent(location.pathname.replace(/^\/agent\//, '').replace(/\/$/, ''));
let statuses = { status: 'idle', last: null, feed: [], inbox: [], unread: 0 };
let lastSnap = null;

const nameEl = document.getElementById('agentname');
const domainEl = document.getElementById('agentdomain');
const pillEl = document.getElementById('pill');
const descEl = document.getElementById('desc');
const toolsEl = document.getElementById('tools');
const feedEl = document.getElementById('feed');

function pillText(s) {
  if (s === 'computing') return '[COMPUTING]';
  if (s === 'auth') return '[HOLD_AUTH]';
  if (s === 'live') return '[LIVE]';
  return '[IDLE]';
}

function renderFeed() {
  const st = statuses;
  pillEl.textContent = pillText(st.status);
  pillEl.className = st.status === 'computing' ? 'computing' : st.status === 'auth' ? 'auth' : st.status === 'live' ? 'live' : '';
  const items = (st.feed || []).slice().reverse();
  if (!items.length) {
    feedEl.innerHTML = '<div class="fe" id="empty">awaiting first activity…</div>';
  } else {
    feedEl.innerHTML = items.map(f => {
      if (f.type === 'tool_use') return `<div class="fe tool_use"><span class="ts">[${esc(f.at ? f.at.slice(11) : '')}]</span><span class="tag">TOOL</span><span class="tool">${esc(f.tool)}</span> <span class="args">${esc(f.args || '')}</span></div>`;
      if (f.type === 'tool_result') return `<div class="fe tool_result"><span class="ts">[${esc(f.at ? f.at.slice(11) : '')}]</span><span class="tag">RESULT</span>${esc((f.text || '').slice(0, 240))}</div>`;
      if (f.type === 'auth') return `<div class="fe auth"><span class="ts">[${esc(f.at ? f.at.slice(11) : '')}]</span><span class="tag">HOLD_AUTH</span>${esc((f.prompt || '').slice(0, 240))}</div>`;
      if (f.type === 'live') return `<div class="fe live"><span class="ts">[${esc(f.at ? f.at.slice(11) : '')}]</span><span class="tag">LIVE</span><span class="tool">${esc(f.tool)}</span> <span class="args">${esc((f.text || '').slice(0, 240))}</span></div>`;
      return '';
    }).join('');
  }
  feedEl.scrollTop = feedEl.scrollHeight;
  renderInbox(st);
}

// v3.0: this agent's inter-agent inbox (direct + broadcast), newest first.
let inboxSeenIds = new Set();  // v3.2: ids already displayed, for arrival flash
let inboxInit = false;         // v3.2: first render seeds the tracker (no flash-all)
function renderInbox(st) {
  const boxEl = document.getElementById('inbox');
  const countEl = document.getElementById('inboxcount');
  const rows = (st.inbox || []);
  // v3.2: if a message id appears that we haven't shown before, flash the
  // inbox frame so new comms are visible even when the tab isn't focused.
  // The FIRST render only seeds the tracker — an inbox that already has
  // messages shouldn't flash everything on window open (reviewer-caught:
  // the flag must gate the flash and be set AFTER the seed loop).
  if (rows.length) {
    const fresh = inboxInit && rows.some(m => !inboxSeenIds.has(m.id));
    rows.forEach(m => inboxSeenIds.add(m.id));
    if (inboxSeenIds.size > 300) inboxSeenIds = new Set(rows.slice(0, 50).map(m => m.id));
    inboxInit = true;
    if (fresh) {
      const w = document.getElementById('inboxwrap');
      w.classList.remove('flash');
      void w.offsetWidth;  // restart the animation
      w.classList.add('flash');
    }
  }
  countEl.textContent = rows.length ? `(${rows.length}${st.unread ? ' · ' + st.unread + ' UNREAD' : ''})` : '';
  if (!rows.length) {
    boxEl.innerHTML = '<div class="fe" id="inboxempty">no messages yet</div>';
    return;
  }
  boxEl.innerHTML = rows.map(m => {
    const dest = m.to === '*' ? 'ALL' : esc(m.to);
    const tag = m.read ? 'read  ' : 'UNREAD';
    return `<div class="fe msg"><span class="ts">[${esc(m.at ? m.at.slice(11) : '')}]</span><span class="tag">${tag}</span><span class="tool">${esc(m.from)}</span> → ${dest} <span class="args">${esc(m.subject || '')}</span><br><span class="args">${esc((m.body || '').slice(0, 200))}</span></div>`;
  }).join('');
  boxEl.scrollTop = boxEl.scrollHeight;
}

async function loadAgent() {
  try {
    const res = await fetch('/api/agent/' + encodeURIComponent(agentName));
    if (!res.ok) {
      descEl.textContent = '✕ unknown agent: ' + agentName;
      nameEl.textContent = agentName.toUpperCase();
      return;
    }
    const data = await res.json();
    const ag = data.agent;
    nameEl.textContent = ag.name.toUpperCase();
    domainEl.textContent = ag.domain.toUpperCase();
    descEl.textContent = ag.description;
    // v3.1: this agent's NVIDIA model (its own, when DOURMOUSE_MODEL_<AGENT> is set).
    const modelEl = document.getElementById('model');
    if (modelEl) modelEl.textContent = 'MODEL: ' + (ag.model || 'default');
    toolsEl.innerHTML = ag.tools.map(t => {
      const cls = t.permission === 'requires_confirmation' ? 'gated' : t.permission === 'prohibited' ? 'prohib' : '';
      return `<span class="tchip ${cls}" title="${esc(t.permission)}">${esc(t.name)}</span>`;
    }).join('') || '<span class="tchip">—</span>';
    statuses = data;
    lastSnap = JSON.stringify(data);
    renderFeed();
  } catch (e) {
    descEl.textContent = '✕ error: ' + e.message;
  }
}

async function poll() {
  try {
    const res = await fetch('/api/agent/' + encodeURIComponent(agentName));
    if (!res.ok) return;
    const data = await res.json();
    const snap = JSON.stringify(data);
    if (snap === lastSnap) return; // dirty-check: no rebuild when unchanged
    lastSnap = snap;
    statuses = data;
    renderFeed();
  } catch (e) { /* transient poll errors ignored */ }
}

// dispatch to this agent via focus_agent
async function dispatchToAgent() {
  const input = document.getElementById('dinput');
  const prompt = input.value.trim();
  if (!prompt) return;
  const btn = document.getElementById('dsend');
  const line = document.getElementById('dstatusline');
  btn.disabled = true;
  line.textContent = 'dispatching…';
  input.value = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, focus_agent: agentName }),
    });
    if (!res.ok || !res.body) { line.textContent = 'HTTP ' + res.status; return; }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', finished = false;
    const handle = evt => {
      if (evt.type === 'done') { line.textContent = '✓ completed'; finished = true; }
      else if (evt.type === 'error') { line.textContent = '✕ ' + evt.message; finished = true; }
    };
    while (!finished) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!chunk.startsWith('data: ')) continue;
        try { handle(JSON.parse(chunk.slice(6))); } catch (e) { /* skip */ }
      }
    }
    try { await reader.cancel(); } catch (e) { /* ignore */ }
  } catch (e) {
    line.textContent = '✕ ' + e.message;
  } finally {
    btn.disabled = false;
    setTimeout(() => { if (line.textContent.includes('completed')) line.textContent = ''; }, 4000);
  }
}

document.getElementById('dsend').addEventListener('click', dispatchToAgent);
document.getElementById('dinput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dispatchToAgent(); }
});

loadAgent();
setInterval(poll, 1000);
</script>
</body>
</html>
