<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOURMOUSE // AGENT ORCHESTRATION MAP</title>
<!-- Shared terminal-IDE design system. Declares the @font-face rules for
     Departure Mono (structure) and Monaspace Neon (machine output) in one
     place across every screen, plus the --dm-* tokens. Linked BEFORE this
     file's own <style> so anything below can override it. -->
<link rel="stylesheet" href="assets/dourmouse-ui.css">
<style>
  /* v13.6: real Fira Sans, bundled locally (ui/assets/fonts/, OFL-licensed)
     — replaces --font-prose's previous "Inter" entry below, which was
     never actually bundled anywhere in this codebase and silently fell
     through to -apple-system on every real machine. Genuine fix. */
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:300;font-display:swap;
    src:url('/assets/fonts/fira-sans-300-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;font-display:swap;
    src:url('/assets/fonts/fira-sans-400-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:italic;font-weight:400;font-display:swap;
    src:url('/assets/fonts/fira-sans-400-italic-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:500;font-display:swap;
    src:url('/assets/fonts/fira-sans-500-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;font-display:swap;
    src:url('/assets/fonts/fira-sans-600-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('/assets/fonts/fira-sans-700-latin.woff2') format('woff2')}
  /* Retheme to the shared terminal-IDE design system (assets/dourmouse-ui.css).
     Same method as ui/workspace.html (commit a6f3a88): the variable NAMES are
     unchanged on purpose -- 232 call sites across this file keep working
     untouched, and the whole look is one block to revert.

     What actually changed, and why, rather than just "new colours":

       - --text / --text-dim / --line / --line-strong were all
         rgba(var(--cyan-rgb), var(--aNN)): every one of them composited the
         background through itself, so a label sitting on a panel sitting on
         the grid read as three stacked hazes rather than as text on a
         surface. They are now solid values.
       - --panel was rgba(18,21,30,0.72) and --surface a near-ground tint,
         which is exactly the translucent-wash failure the design brief names.
         Both are now flat, opaque layer colours; agent cards, the detail
         rail and the header all sit on real surfaces.
       - The eight-step alpha scale (--a06 .. --a85) is kept DEFINED but no
         longer used for any surface, border or text. It stays so this block
         is a clean one-step revert and so nothing that reads the custom
         properties at runtime breaks.
       - --cyan keeps its name and its job (the single active/selection
         accent) but is now amber; --amber, --gold and --cyan collapse to the
         same accent, because a four-hue status palette on tags/pills is the
         "coloured badge" failure the brief calls out. Red survives for
         prohibited tools only.
       - Type moves mono-first: Departure Mono carries structure (the
         wordmark, view toggles, buttons), Monaspace Neon carries everything
         the machine says, including prose. Fira Sans stays loaded and one
         line away (--font-prose-alt) if mono prose reads too dense.
       - --text-body is the one genuinely NEW variable: this file only had
         two text levels (--text / --text-dim) and the new system has three.
         Agent descriptions are prose and want the body value, not the label
         value they were sharing.

     Previous values, for a one-step revert:
       --ground:#0B0E14; --surface:#12151E;
       --cyan:#4FC3F7; --cyan-rgb:79,195,247;
       --amber:#F5A623; --amber-rgb:245,166,35;
       --red:#EF5350; --red-rgb:239,83,80;
       --gold:#FFD232; --gold-rgb:255,210,50;
       --dead:#8A929E; --dead-rgb:138,146,158;
       --text:rgba(var(--cyan-rgb),var(--a85));
       --text-dim:rgba(var(--cyan-rgb),var(--a45));
       --line:rgba(var(--cyan-rgb),var(--a10));
       --line-strong:rgba(var(--cyan-rgb),var(--a30));
       --panel:rgba(18,21,30,0.72);
       --font-display:"Exo 2",...; --font-mono:"JetBrains Mono",...;
       --font-prose:"Fira Sans",...; --font-wordmark:"Orbitron",...          */
  :root {
    /* ---- layers: four solid values, no alpha, no intermediates ---- */
    --ground: #09090B;
    --surface: #18181B;
    --layer-hi: #27272A;
    --cyan:  #F59E0B; --cyan-rgb:  245,158,11;
    --amber: #F59E0B; --amber-rgb: 245,158,11;
    --red:   #EF4444; --red-rgb:   239,68,68;
    --gold:  #F59E0B; --gold-rgb:  245,158,11;
    --ok:    #10B981;
    --dead:  #52525B; --dead-rgb:  82,82,91;
    /* Kept defined for a clean revert; no longer used for any surface. */
    --a06: 0.06; --a10: 0.10; --a16: 0.16; --a22: 0.22;
    --a30: 0.30; --a45: 0.45; --a60: 0.60; --a85: 0.85;
    /* ---- type: structure vs machine output ---- */
    --font-display:  'Departure Mono','Commit Mono','Intel One Mono',ui-monospace,monospace;
    --font-mono:     'Berkeley Mono','Monaspace Neon','JetBrains Mono NL','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --font-prose:    'Berkeley Mono','Monaspace Neon','JetBrains Mono',ui-monospace,monospace;
    --font-prose-alt:'Fira Sans',-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    --font-wordmark: 'Departure Mono','Commit Mono','Intel One Mono',ui-monospace,monospace;
    /* ---- semantic aliases: three solid text levels ---- */
    --text: #FAFAFA;
    --text-body: #A1A1AA;
    --text-dim: #71717A;
    --line: #27272A;
    --line-strong: #3F3F46;
    --panel: #18181B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* The two radial-gradient washes that used to sit here are gone: a
     coloured glow bleeding out of two corners is pure decoration. */
  body {
    background: var(--ground);
    color: var(--text-body);
    font-family: var(--font-mono);
    overflow: hidden;
  }
  /* The scanline overlay was a 1.4%-alpha cyan grille in overlay blend mode
     -- decoration, and one more translucent layer over everything. Kept as
     an empty positioned element so the markup and any JS that looks it up
     still work, but it paints nothing. */
  .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

  /* ---------------- header ---------------- */
  /* Pre-existing overflow bug, found by measuring rather than reading: this
     row is display:flex with no wrap and every child nowrap, so below about
     1080px the title + search + view toggles + [OPEN DASHBOARD] were wider
     than the header and the last control was clipped off the right edge
     with no scroll and no overflow menu -- exactly the dock bug found in
     workspace.html. The house pattern: the row scrolls, the scrollbar is
     hidden, and the trailing edge fades to signal there is more. */
  #hdr {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--surface);
    flex: 0 0 auto; min-width: 0; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
  }
  #hdr::-webkit-scrollbar { display: none; }
  #hdr .title {
    font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: 0.14em;
    color: var(--text); white-space: nowrap; flex: 0 0 auto;
  }
  #hdr .sub { font-size: 8px; letter-spacing: 0.10em; font-weight: 400; color: var(--text-dim); white-space: nowrap; }
  #searchwrap { position: relative; flex: 1 1 240px; min-width: 160px; max-width: 560px; }
  #search {
    width: 100%; padding: 10px 14px; border-radius: 0;
    border: 1px solid var(--line-strong); background: var(--ground);
    color: var(--text); font-family: var(--font-mono); font-size: 12px; font-weight: 400; outline: none;
    transition: border-color 200ms;
  }
  #search:focus { border-color: var(--cyan); }
  #search::placeholder { color: var(--text-dim); opacity: 1; }
  #results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    border: 1px solid var(--line-strong); overflow: hidden;
    background: var(--surface); display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  #results.open { display: block; }
  .res-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid var(--line); transition: background 120ms;
  }
  .res-row:last-child { border-bottom: none; }
  .res-row:hover { background: var(--layer-hi); }
  .res-row .rn { color: var(--text); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; }
  .res-row .rt { font-size: 9px; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
  .res-row .rt .sc { color: var(--text); }
  #viewtoggle { display: flex; gap: 6px; flex: 0 0 auto; }
  .vt {
    font-family: var(--font-display); font-size: 9px; letter-spacing: 0.06em; font-weight: 400;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 0;
    background: var(--surface); color: var(--text-dim); cursor: pointer;
    transition: background 150ms, color 150ms, border-color 150ms; white-space: nowrap;
  }
  .vt:hover { color: var(--text); background: var(--layer-hi); }
  .vt.active { color: var(--text); background: var(--layer-hi); border-color: var(--line-strong); }
  #hdr .open-dash {
    margin-left: auto; flex: 0 0 auto;
    font-family: var(--font-display); font-size: 9px; letter-spacing: 0.06em; font-weight: 400;
    padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 0;
    background: var(--layer-hi);
    color: var(--text); cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: border-color 150ms, color 150ms;
  }
  #hdr .open-dash:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ---------------- body: map + detail ---------------- */
  #body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }

  /* The 34px workbench grid stays -- a grid is a real terminal idiom, not
     ornament -- but it is a crisp solid rule at the structural layer colour
     instead of a 6%-alpha cyan smear. */
  #map {
    position: relative; overflow-y: auto; overflow-x: hidden; padding: 26px; min-width: 0;
    background:
      linear-gradient(var(--surface) 1px, transparent 1px),
      linear-gradient(90deg, var(--surface) 1px, transparent 1px),
      var(--ground);
    background-size: 34px 34px, 34px 34px, auto;
  }
  #maptitle { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.13em; font-weight: 400; color: var(--text-dim); margin-bottom: 18px; }
  #nodes {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
  }
  .node {
    border: 1px solid var(--line); padding: 14px; min-width: 0;
    background: var(--surface); cursor: pointer;
    transition: border-color 180ms ease-out, background 180ms ease-out;
    position: relative; overflow: hidden;
  }
  .node:hover { border-color: var(--line-strong); background: var(--layer-hi); }
  .node.selected { border-color: var(--cyan); background: var(--layer-hi); }
  .node .ring { position: absolute; inset: 0; pointer-events: none; }
  /* The computing ring used to be a pulsing inset glow. It is now a solid
     inset rule that blinks on and off -- same information, no halo. */
  .node.computing .ring { animation: ringpulse 1.1s steps(1, end) infinite; }
  @keyframes ringpulse { 0%,49% { box-shadow: inset 0 0 0 1px var(--cyan); } 50%,100% { box-shadow: inset 0 0 0 1px transparent; } }
  .node.auth { border-color: var(--amber); }
  .nhead { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .spinner { width: 30px; height: 30px; flex: none; }
  .spinner circle:last-child { transform-origin: center; transform-box: fill-box; animation: spin 2.4s linear infinite; }
  .node.computing .spinner circle:last-child { animation-duration: 0.55s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .nname { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ndomain { font-size: 8px; letter-spacing: 0.10em; font-weight: 400; color: var(--text-dim); white-space: nowrap; }
  /* One monochrome pill, not a palette of coloured ones. State is carried
     by the text inside the pill and by the row's own border, not by hue.
     The single exception below is .auth, which is the one state that needs
     a human to act -- it gets the accent, and only the accent. */
  .npill {
    margin-left: auto; flex: none; font-size: 8px; letter-spacing: 0.06em; font-weight: 400; padding: 3px 7px;
    border: 1px solid var(--line-strong); border-radius: 0;
    color: var(--text-dim); background: var(--layer-hi); white-space: nowrap;
  }
  .npill.computing { color: var(--text); animation: pulse 0.9s infinite; }
  .npill.auth { color: var(--amber); border-color: var(--amber); animation: blink 0.8s step-start infinite; }
  .npill.live { color: var(--ok); animation: pulse 2.2s infinite; }
  .node.live { border-color: var(--line-strong); }
  .nunread {
    position: absolute; top: 10px; right: 10px; font-size: 8px; letter-spacing: 0.06em;
    padding: 2px 6px; color: var(--text); border-radius: 0;
    border: 1px solid var(--line-strong); background: var(--layer-hi);
    animation: pulse 2s infinite;
  }
  .fe.msg { border-color: var(--line-strong); }
  .fe.msg .tag { color: var(--text); font-weight: 500; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes blink { 50% { opacity: 0.3; } }
  .ndesc { font-size: 9px; font-weight: 400; color: var(--text-body); margin: 9px 0 8px; line-height: 1.45; }
  .nlast { font-size: 9px; font-weight: 400; color: var(--text-dim); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nlast b { color: var(--text); font-weight: 500; }

  /* ---------------- detail panel ---------------- */
  #detail {
    border-left: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }
  .dtitle { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.13em; font-weight: 400; color: var(--text-dim); padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #dbody { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .dempty { color: var(--text-body); font-size: 10px; letter-spacing: 0.06em; font-weight: 400; line-height: 1.8; text-align: center; padding: 30px 10px; }
  #dname { font-size: 14px; font-weight: 500; letter-spacing: 0.06em; color: var(--text); }
  #dstatus { display: inline-block; margin-left: 8px; font-size: 8px; letter-spacing: 0.06em; font-weight: 400; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 0; color: var(--text-dim); background: var(--layer-hi); vertical-align: middle; }
  #dstatus.computing { color: var(--text); animation: pulse 0.9s infinite; }
  #dstatus.auth { color: var(--amber); border-color: var(--amber); animation: blink 0.8s infinite; }
  #dstatus.live { color: var(--ok); animation: pulse 2.2s infinite; }
  #ddesc { font-size: 10px; font-weight: 400; color: var(--text-body); line-height: 1.55; }
  #dmodel { font-size: 9px; font-weight: 400; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 7px; }
  .sec { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.13em; font-weight: 400; color: var(--text-dim); margin: 4px 0 8px; }
  .dtools { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
  /* One monochrome chip. "gated" and "prohibited" were an amber and a red
     chip sitting beside the plain one -- three tag colours in a 380px rail.
     They now differ by their border and their label, not by hue. */
  .dchip { font-size: 8px; letter-spacing: 0.06em; font-weight: 400; padding: 3px 8px; border-radius: 0;
    background: var(--layer-hi); border: 1px solid var(--line); color: var(--text-dim);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dchip.gated { border-color: var(--line-strong); color: var(--text-body); }
  .dchip.prohib { border-color: var(--red); color: var(--red); }
  #dispatchbox { border: 1px solid var(--line-strong); padding: 10px; background: var(--ground); min-width: 0; }
  #dispatchbox:focus-within { border-color: var(--cyan); }
  /* v5.2: one-click suggested tasks in the dispatch box */
  .sugg {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em;
    color: var(--text-dim); border: 1px solid var(--line); background: var(--surface);
    padding: 4px 9px; cursor: pointer; transition: color 140ms, border-color 140ms; border-radius: 0;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sugg:hover { color: var(--text); border-color: var(--line-strong); }
  #dinput { width: 100%; background: transparent; border: none; outline: none; resize: none; color: var(--text); font-family: var(--font-mono); font-size: 11px; font-weight: 400; line-height: 1.5; }
  #dinput::placeholder { color: var(--text-dim); opacity: 1; }
  .drow { display: flex; gap: 8px; margin-top: 8px; min-width: 0; }
  #dsend, #dopenwin {
    font-family: var(--font-display); font-size: 9px; font-weight: 400; letter-spacing: 0.06em;
    padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 0;
    background: var(--layer-hi); color: var(--text);
    cursor: pointer; transition: border-color 120ms, color 120ms;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #dsend { flex: 1 1 auto; }
  #dopenwin { flex: 0 1 auto; }
  #dsend:hover:not(:disabled), #dopenwin:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  #dsend:disabled, #dopenwin:disabled { opacity: 0.4; cursor: not-allowed; }
  #dstatusline { font-size: 9px; font-weight: 400; color: var(--text-dim); letter-spacing: 0.04em; }
  #dfeed { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fe {
    font-size: 10px; font-weight: 400; line-height: 1.5; padding: 7px 10px; color: var(--text-body);
    border: 1px solid var(--line); background: var(--ground); white-space: pre-wrap; word-break: break-word;
  }
  .fe .ts { color: var(--dead); }
  .fe.tool_use { border-color: var(--line-strong); }
  .fe.tool_use .tag { color: var(--text); font-weight: 500; }
  .fe.tool_result { border-color: var(--line-strong); }
  .fe.tool_result .tag { color: var(--text); font-weight: 500; }
  .fe.auth { border-color: var(--amber); }
  .fe.auth .tag { color: var(--amber); font-weight: 500; }
  .fe.live { border-color: var(--line-strong); }
  .fe.live .tag { color: var(--ok); font-weight: 500; }

  /* ---------------- neural link graph view ---------------- */
  #graph { position: relative; width: 100%; height: 100%; min-height: 540px; }
  #graph svg { width: 100%; height: 100%; display: block; }
  /* v5.2: hover strip — explains the hovered node inside the graph view. */
  #graphstrip {
    height: 26px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: 10px; letter-spacing: 0.05em; color: var(--text-dim);
    padding: 6px 4px 0; opacity: 0; transition: opacity 140ms ease;
  }
  .g-link { stroke-width: 1; opacity: 0.5; transition: opacity 0.2s; }
  .g-link.delegate { stroke: var(--line-strong); stroke-dasharray: 4 5; }
  .g-link.memory { stroke: var(--line-strong); }
  .g-link.peer { stroke: var(--dead); }
  .g-link.active { stroke: var(--cyan); opacity: 1; animation: linkpulse 1.1s ease-in-out infinite; }
  @keyframes linkpulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  .g-node { cursor: pointer; transition: transform 0.15s; }
  .g-node:hover { transform: scale(1.07); }
  .g-node circle { transition: stroke 0.2s; }
  /* Selection is a heavier accent stroke, not a drop-shadow halo. */
  .g-node.selected circle { stroke: var(--cyan); stroke-width: 3; }
  .g-node text { fill: var(--text); font-size: 9.5px; font-family: var(--font-mono); letter-spacing: 0.08em; pointer-events: none; }
  .g-node .glabel { font-size: 8px; fill: var(--text-dim); letter-spacing: 0.12em; }
  .g-node.active circle { animation: gpulse 1s ease-in-out infinite; }
  @keyframes gpulse { 0%,100% { stroke-width: 2; } 50% { stroke-width: 6; } }

  /* ---------------- live bus communication visualization ---------------- */
  .pulse-trail { pointer-events: none; }
  .pulse-dot { pointer-events: none; }
  /* The flash used to be a 20px expanding glow ring. It is now the accent
     border, held for the same duration -- the event still reads, without a
     light source. */
  .node.flash { animation: nodeflash 0.7s ease-out; }
  @keyframes nodeflash { 0% { border-color: var(--cyan); } 100% { border-color: var(--line); } }
  #stream {
    position: fixed; left: 20px; bottom: 18px; z-index: 40;
    display: flex; flex-direction: column-reverse; gap: 6px; max-width: min(540px, calc(100vw - 40px));
    pointer-events: none;
  }
  .tic {
    font-size: 9px; font-weight: 400; line-height: 1.5; padding: 8px 12px;
    background: var(--surface); border: 1px solid var(--line-strong);
    color: var(--text-body);
    animation: ticin 0.28s ease-out; transition: opacity 0.6s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tic b { color: var(--text); font-weight: 500; }
  .tic .tto { color: var(--text); }
  .tic .tclose { color: var(--dead); }
  @keyframes ticin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--ground); }
  ::-webkit-scrollbar-thumb { background: var(--layer-hi); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

  @media (max-width: 900px) {
    #body { grid-template-columns: minmax(0, 1fr); }
    #detail { border-left: none; border-top: 1px solid var(--line); }
    #hdr .sub { display: none; }
  }
  /* phone-friendly layout — map becomes a single column with the detail
     panel below the graph. */
  @media (max-width: 760px) {
    #body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr auto; }
    #detail { max-height: 42vh; }
    .toolbar { flex-wrap: wrap; }
    .keyhint { display: none; }
    #search { font-size: 14px; min-height: 40px; }
  }

  /* ---------------- in-window frame panel (#dmframe) ----------------
     Explicit user requirement: "for each tab in dourmouse, ensure it opens
     in one window, doesn't open new separate windows." An agent's live
     screen (/agent/<name>) used to be a window.open() popup from both the
     [LIVE WINDOW] button and from dispatch; it now loads in here. Follows
     this file's own overlay convention (#results above): hidden by default,
     revealed by an .open class. .dmf-frame mirrors ui/workspace.html's
     .iframepanel. */
  /* The scrim is the one place a translucent fill is doing real work --
     it has to show that the page underneath is still there. It keeps the
     alpha but loses the decorative blur behind it. */
  #dmframe {
    position: fixed; inset: 0; z-index: 92; display: none;
    align-items: center; justify-content: center; padding: 3vh 2vw;
    background: rgba(9,9,11,0.82);
  }
  #dmframe.open { display: flex; }
  .dmf-box {
    width: min(96vw, 1180px); height: min(94vh, 900px);
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line-strong); background: var(--surface);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  .dmf-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-bottom: 1px solid var(--line); min-width: 0;
  }
  .dmf-title {
    flex: 1 1 auto; min-width: 0; font-size: 10px; letter-spacing: 0.14em;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dmf-head button {
    flex: 0 0 auto; font-family: var(--font-display); font-size: 9px;
    letter-spacing: 0.12em; color: var(--text-dim); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 0; padding: 6px 11px; cursor: pointer;
    white-space: nowrap;
  }
  .dmf-head button:hover { background: var(--layer-hi); color: var(--text); }
  .dmf-body { flex: 1; min-height: 0; position: relative; background: var(--ground); }
  .dmf-frame { width: 100%; height: 100%; border: none; display: block; background: var(--ground); }
  /* honest failure surface — shown only when the embed really did not load */
  .dmf-note {
    position: absolute; left: 0; right: 0; bottom: 0; display: none;
    font-size: 9px; letter-spacing: 0.08em; line-height: 1.6; color: var(--amber);
    background: var(--surface); padding: 8px 12px;
    border-top: 1px solid var(--amber);
  }
  .dmf-note.show { display: block; }
  @media (max-width: 760px) {
    #dmframe { padding: 0; }
    .dmf-box { width: 100vw; height: 100vh; border: none; }
  }

  /* reduced motion — freeze rotation and pulse, keep alpha states and glyphs */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div id="app">
  <header id="hdr">
    <div>
      <div class="title">◈ AGENT ORCHESTRATION MAP</div>
      <div class="sub">DISPATCH NETWORK // LIVE</div>
    </div>
    <div id="searchwrap">
      <input id="search" type="text" placeholder="FIND THE AGENT FOR A TASK — e.g. 'search the web', 'delete a file', 'draft an email'…" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <div id="viewtoggle">
      <button class="vt active" data-view="grid">[GRID]</button>
      <button class="vt" data-view="neural">[NEURAL_LINK]</button>
    </div>
    <a class="open-dash" href="/">OPEN DASHBOARD</a>
  </header>

  <div id="body">
    <div id="map">
      <div id="maptitle">SUPERVISED SUBAGENT NETWORK // CLICK A NODE TO INSPECT</div>
      <div id="nodes">SCANNING ROSTER…</div>
      <div id="graph" style="display:none"></div>
      <div id="graphstrip"></div>
      <div id="stream"></div>
    </div>

    <aside id="detail">
      <div class="dtitle">AGENT DETAIL // LIVE TELEMETRY</div>
      <div id="dbody">
        <div class="dempty">Select an agent from the map to see what it's doing,<br>its tools, and dispatch a task directly to it.</div>
      </div>
    </aside>
  </div>
</div>

<!-- in-window frame panel — an agent's live screen (/agent/<name>) loads in
     HERE instead of spawning a separate OS window. Static shell only: the
     frame's src and the title are assigned as DOM properties by
     openFramePanel(), so an agent name never reaches markup. -->
<div id="dmframe" role="dialog" aria-modal="true" aria-label="Agent live panel" aria-hidden="true">
  <div class="dmf-box">
    <div class="dmf-head">
      <div class="dmf-title" id="dmfTitle">PANEL</div>
      <button type="button" id="dmfPop" title="Fallback: open this screen in a separate window instead">⧉ NEW WINDOW</button>
      <button type="button" id="dmfClose" title="Close this panel (Esc)">✕ CLOSE</button>
    </div>
    <div class="dmf-body">
      <iframe id="dmfFrame" class="dmf-frame" title="Agent live panel"
              referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write"></iframe>
      <div class="dmf-note" id="dmfNote"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const nodesEl = document.getElementById('nodes');
  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  const dbody = document.getElementById('dbody');

  let roster = [];            // [{name, domain, description, tools:[{name,permission,description}]}]
  let selected = null;        // selected agent name
  let statuses = {};          // name -> {status, last, feed}
  let nodeEls = {};           // name -> DOM element
  let inboxes = {};           // name -> {inbox, unread} (v3.0 bus data)
  let lastRenderedSnap = null; // JSON of the selected agent's state we last rendered
  let graphPos = {};           // name -> {x,y} neural-view node positions (v3.2)
  let lastMsgId = 0;           // highest bus msg id already animated (v3.2)

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function now() { return new Date().toTimeString().slice(0, 8); }

  // ---------- one window: the in-window frame panel ----------
  // Explicit user requirement: "for each tab in dourmouse, ensure it opens
  // in one window, doesn't open new separate windows." An agent's live
  // screen (/agent/<name>) is served by this same server on this same
  // origin, so framing it is genuinely the same app in the same session —
  // the approach ui/workspace.html already uses (loadIframePanel /
  // .iframepanel). The old separate-window openers stay wired as the
  // fallback, never as the default path.
  //
  // The panel shell in <body> is static markup; href and title are set as
  // DOM properties, so an agent name is never interpolated into HTML.
  let framePrevFocus = null;   // what to hand focus back to on close
  let frameExternal = null;    // separate-window fallback for what's loaded
  let frameWatchdog = null;
  let frameWired = false;

  function frameEls() {
    return {
      root:  document.getElementById('dmframe'),
      frame: document.getElementById('dmfFrame'),
      title: document.getElementById('dmfTitle'),
      note:  document.getElementById('dmfNote'),
      pop:   document.getElementById('dmfPop'),
      close: document.getElementById('dmfClose'),
    };
  }

  function closeFramePanel() {
    const el = frameEls();
    if (!el.root) return;
    if (frameWatchdog) { clearTimeout(frameWatchdog); frameWatchdog = null; }
    el.root.classList.remove('open');
    el.root.setAttribute('aria-hidden', 'true');
    if (el.note) { el.note.classList.remove('show'); el.note.textContent = ''; }
    if (el.frame) {
      // Drop handlers BEFORE blanking, or the about:blank load re-enters
      // the previous panel's load check.
      el.frame.onload = null; el.frame.onerror = null;
      // Tear the embedded document down so its own polling/SSE stops.
      el.frame.src = 'about:blank';
    }
    frameExternal = null;
    // Never trap the user: hand focus back to whatever opened the panel.
    const back = framePrevFocus; framePrevFocus = null;
    if (back && typeof back.focus === 'function') { try { back.focus(); } catch (e) { /* detached */ } }
  }

  function wireFramePanel() {
    if (frameWired) return true;
    const el = frameEls();
    if (!el.root || !el.frame) return false;
    if (el.close) el.close.addEventListener('click', closeFramePanel);
    if (el.pop) el.pop.addEventListener('click', () => {
      const ext = frameExternal;      // capture: closeFramePanel() clears it
      closeFramePanel();
      if (typeof ext === 'function') ext();
    });
    el.root.addEventListener('click', (ev) => { if (ev.target === el.root) closeFramePanel(); });
    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && el.root.classList.contains('open')) closeFramePanel();
    });
    frameWired = true;
    return true;
  }

  // external: the pre-existing separate-window opener, kept as a GENUINE
  // fallback — used when the panel shell is absent, and offered behind the
  // panel's ⧉ NEW WINDOW button when the embed fails to render.
  function openFramePanel(href, title, external) {
    frameExternal = (typeof external === 'function') ? external : null;
    if (!wireFramePanel()) {
      const ext = frameExternal; frameExternal = null;
      if (ext) ext();
      return;
    }
    const el = frameEls();
    framePrevFocus = (document.activeElement && document.activeElement !== document.body)
      ? document.activeElement : null;
    if (frameWatchdog) { clearTimeout(frameWatchdog); frameWatchdog = null; }
    if (el.note) { el.note.classList.remove('show'); el.note.textContent = ''; }
    const label = String(title == null ? href : title);
    if (el.title) el.title.textContent = label;
    el.frame.title = label;

    let settled = false;
    const done = () => {
      settled = true;
      if (frameWatchdog) { clearTimeout(frameWatchdog); frameWatchdog = null; }
    };
    const fail = (why) => {
      if (settled) return;
      done();
      if (el.note) {
        el.note.textContent = why + ' Use ⧉ NEW WINDOW above to open it separately.';
        el.note.classList.add('show');
      }
    };
    el.frame.onload = () => {
      if (settled) return;
      // Same origin (always, here): the result is genuinely inspectable, so
      // a blank or refused embed is detected rather than assumed to work.
      let body = null;
      try { body = el.frame.contentDocument && el.frame.contentDocument.body; }
      catch (e) { body = null; }
      if (!body || (!body.childElementCount && !(body.textContent || '').trim())) {
        fail('This screen did not render inside the panel.');
        return;
      }
      done();
    };
    el.frame.onerror = () => fail('This screen failed to load inside the panel.');
    frameWatchdog = setTimeout(() => fail('This screen did not load in time.'), 8000);

    el.frame.src = href;
    el.root.classList.add('open');
    el.root.setAttribute('aria-hidden', 'false');
    if (el.close) { try { el.close.focus(); } catch (e) { /* ignore */ } }
  }

  function openAgentWindowExternal(name) {
    // The pre-conversion behaviour, kept verbatim as the genuine fallback.
    const api = (window.pywebview && window.pywebview.api) || null;
    if (api && typeof api.open_agent === 'function') { api.open_agent(name); return; }
    window.open('/agent/' + encodeURIComponent(name), 'dourmouseAgent_' + name, 'width=980,height=760');
  }
  function openAgentPanel(name) {
    openFramePanel('/agent/' + encodeURIComponent(name),
                   'AGENT // ' + String(name).toUpperCase(),
                   () => openAgentWindowExternal(name));
  }

  function renderNodes() {
    nodesEl.innerHTML = '';
    nodeEls = {};
    for (const ag of roster) {
      const el = document.createElement('div');
      el.className = 'node';
      el.dataset.name = ag.name;
      el.innerHTML = `
        <div class="ring"></div>
        <div class="nhead">
          <svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--line-strong)" stroke-width="2"/><circle cx="12" cy="12" r="10" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="15 47" stroke-linecap="round"/></svg>
          <div><div class="nname">${esc(ag.name)}</div><div class="ndomain">${esc(ag.domain)}</div></div>
          <div class="npill">[IDLE]</div>
        </div>
        <div class="ndesc">${esc(ag.description)}</div>
        <div class="nlast"><b>LAST</b>: awaiting first dispatch</div>`;
      el.addEventListener('click', () => selectAgent(ag.name));
      applyInboxBadge(ag.name);
      nodesEl.appendChild(el);
      nodeEls[ag.name] = el;
    }
  }

  function pillText(status) {
    return status === 'computing' ? '[COMPUTING]' : status === 'auth' ? '[HOLD_AUTH]' : status === 'live' ? '[LIVE]' : '[IDLE]';
  }

  // v3.0: unread message badge on each node card + inbox in the detail feed.
  function applyInboxBadge(name) {
    const el = nodeEls[name];
    if (!el) return;
    const unread = (inboxes[name] && inboxes[name].unread) || 0;
    let b = el.querySelector('.nunread');
    if (unread > 0) {
      if (!b) {
        b = document.createElement('div');
        b.className = 'nunread';
        b.textContent = unread + ' MSG';
        el.appendChild(b);
      } else {
        b.textContent = unread + ' MSG';
      }
    } else if (b) {
      b.remove();
    }
  }

  function applyStatuses() {
    for (const [name, st] of Object.entries(statuses)) {
      const el = nodeEls[name];
      if (!el) continue;
      el.classList.toggle('computing', st.status === 'computing');
      el.classList.toggle('auth', st.status === 'auth');
      el.classList.toggle('live', st.status === 'live');
      const pill = el.querySelector('.npill');
      pill.className = 'npill' + (st.status === 'computing' ? ' computing' : st.status === 'auth' ? ' auth' : st.status === 'live' ? ' live' : '');
      pill.textContent = pillText(st.status);
      const last = el.querySelector('.nlast');
      if (st.last && st.last.tool) {
        last.innerHTML = `<b>LAST</b>: ${esc(st.last.tool)}${st.last.result ? ' → done' : st.status !== 'idle' ? ' … running' : ' → done'}`;
      } else {
        last.innerHTML = `<b>LAST</b>: awaiting first dispatch`;
      }
      applyInboxBadge(name);
      if (name === selected) {
        // Only re-render the detail panel when the agent's data ACTUALLY
        // changed — otherwise the 1s poll would rebuild the dispatch
        // textarea every tick and wipe in-progress typed input.
        const snap = JSON.stringify(st) + JSON.stringify(inboxes[name] || {});
        if (snap !== lastRenderedSnap) { lastRenderedSnap = snap; renderDetail(); }
      }
    }
  }

  // ---------- detail panel ----------
  function selectAgent(name) {
    selected = name;
    lastRenderedSnap = null;  // force a fresh render on click
    for (const [n, el] of Object.entries(nodeEls)) el.classList.toggle('selected', n === name);
    renderDetail();
    if (searchEl.value) { searchEl.value = ''; resultsEl.classList.remove('open'); }
  }

  function renderDetail() {
    const ag = roster.find(a => a.name === selected);
    if (!ag) return;
    const st = statuses[selected] || { status: 'idle', last: null, feed: [] };
    let chips = '';
    for (const t of ag.tools) {
      const cls = t.permission === 'requires_confirmation' ? 'gated' : t.permission === 'prohibited' ? 'prohib' : '';
      chips += `<span class="dchip ${cls}" title="${esc(t.permission)}">${esc(t.name)}</span>`;
    }
    const feedHtml = (st.feed || []).slice().reverse().map(f => {
      if (f.type === 'tool_use') return `<div class="fe tool_use"><span class="ts">[${f.at ? f.at.slice(11) : ''}]</span> <span class="tag">TOOL</span> ${esc(f.tool)} ${esc(f.args || '')}</div>`;
      if (f.type === 'tool_result') return `<div class="fe tool_result"><span class="ts">[${f.at ? f.at.slice(11) : ''}]</span> <span class="tag">RESULT</span> ${esc((f.text || '').slice(0, 160))}</div>`;
      if (f.type === 'auth') return `<div class="fe auth"><span class="ts">[${f.at ? f.at.slice(11) : ''}]</span> <span class="tag">HOLD_AUTH</span> ${esc((f.prompt || '').slice(0, 160))}</div>`;
      if (f.type === 'live') return `<div class="fe live"><span class="ts">[${f.at ? f.at.slice(11) : ''}]</span> <span class="tag">LIVE</span> ${esc(f.tool)} — ${esc((f.text || '').slice(0, 160))}</div>`;
      return '';
    }).join('') || '<div class="fe"><span class="ts">[—]</span> no activity yet</div>';
    // v3.0: real inter-agent inbox for this agent (direct + broadcast).
    const box = inboxes[selected] || { inbox: [], unread: 0 };
    const unread = box.unread || 0;
    const inboxRows = (box.inbox || []).map(m => {
      const dest = m.to === '*' ? 'ALL' : esc(m.to);
      const tag = m.read ? 'read  ' : 'UNREAD';
      return `<div class="fe msg"><span class="ts">[${m.at ? m.at.slice(11) : ''}]</span> <span class="tag">${tag}</span> <b style="color:var(--text)">${esc(m.from)}</b> → ${dest} <b style="color:var(--text)">${esc(m.subject || '')}</b><br>${esc((m.body || '').slice(0, 160))}</div>`;
    }).join('') || '<div class="fe"><span class="ts">[—]</span> no messages yet</div>';
    const inboxHtml = inboxRows;

    // v5.2: per-agent suggested directives — click to fill+send, so the
    // dispatch box is usable, not a blank prompt. Built from the agent's
    // actual tool names (deterministic, no LLM).
    const suggestions = suggestFor(ag);
    const suggHtml = suggestions.length
      ? `<div class="drow" style="flex-wrap:wrap;margin-bottom:8px">${suggestions.map(s =>
          `<button class="sugg" data-task="${esc(s)}">${esc(s)}</button>`).join('')}</div>`
      : '';

    dbody.innerHTML = `
      <div><span id="dname">${esc(ag.name)}</span><span id="dstatus" class="${st.status === 'computing' ? 'computing' : st.status === 'auth' ? 'auth' : st.status === 'live' ? 'live' : ''}">${pillText(st.status)}</span></div>
      <div id="ddesc">${esc(ag.description)}</div>
      <div id="dmodel">MODEL: ${esc(ag.model || 'default')}</div>
      <div class="sec">TOOLKIT</div>
      <div class="dtools">${chips}</div>
      <div class="sec">DISPATCH DIRECTIVE</div>
      <div id="dispatchbox">
        ${suggHtml}
        <textarea id="dinput" rows="2" placeholder="Send a task to ${esc(ag.name)}…"></textarea>
        <div class="drow">
          <button id="dsend">[SEND_DIRECTIVE]</button>
          <button id="dopenwin" title="Open ${esc(ag.name)}'s own live screen as a panel in this window">[LIVE PANEL]</button>
          <div id="dstatusline"></div>
        </div>
      </div>
      <div class="sec">LIVE ACTIVITY FEED</div>
      <div id="dfeed">${feedHtml}</div>
      <div class="sec">INBOX // INTER-AGENT COMMS${unread ? ' <span style="color:var(--text)">(' + unread + ' UNREAD)</span>' : ''}</div>
      <div id="dinbox">${inboxHtml}</div>`;

    document.querySelectorAll('#dispatchbox .sugg').forEach(b => {
      b.addEventListener('click', () => {
        const task = b.dataset.task;
        const di = document.getElementById('dinput');
        di.value = task;
        dispatchToAgent(ag.name);
      });
    });
    document.getElementById('dsend').addEventListener('click', () => dispatchToAgent(ag.name));
    // One window: the agent's live screen opens as a panel in this window.
    // The separate-window opener stays wired verbatim as the panel's
    // ⧉ NEW WINDOW fallback — native window via the desktop bridge when
    // present, otherwise the old popup.
    document.getElementById('dopenwin').addEventListener('click', () => {
      openFramePanel('/agent/' + encodeURIComponent(ag.name),
                     'AGENT // ' + String(ag.name).toUpperCase(), () => {
        const api = (window.pywebview && window.pywebview.api) || null;
        if (api && typeof api.open_agent === 'function') { api.open_agent(ag.name); }
        else { window.open('/agent/' + encodeURIComponent(ag.name), 'dourmouseAgent_' + ag.name, 'width=980,height=760'); }
      });
    });
    const di = document.getElementById('dinput');
    di.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dispatchToAgent(ag.name); } });
    di.focus();
  }

  async function dispatchToAgent(name) {
    const prompt = document.getElementById('dinput').value.trim();
    if (!prompt) return;
    // v2.7: dispatching to an agent also opens its own live screen, so you
    // can watch it work from every entry point (dashboard + map + panel).
    // One window: this is now a panel over the map, not a second window.
    openAgentPanel(name);
    const btn = document.getElementById('dsend');
    const line = document.getElementById('dstatusline');
    btn.disabled = true;
    line.textContent = 'dispatching…';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, focus_agent: name }),
      });
      if (!res.ok || !res.body) { line.textContent = 'HTTP ' + res.status; return; }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', finished = false;
      const handle = evt => {
        if (evt.type === 'done') { line.textContent = '✓ completed'; finished = true; }
        else if (evt.type === 'error') { line.textContent = '✕ ' + evt.message; finished = true; }
      };
      while (!finished) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          if (!chunk.startsWith('data: ')) continue;
          try { handle(JSON.parse(chunk.slice(6))); } catch (e) { /* skip */ }
        }
      }
      try { await reader.cancel(); } catch (e) { /* ignore */ }
    } catch (e) {
      line.textContent = '✕ ' + e.message;
    } finally {
      btn.disabled = false;
      setTimeout(() => { if (line.textContent.includes('completed')) line.textContent = ''; }, 4000);
    }
  }

  // v5.2: deterministic suggested tasks per agent, built from its tool
  // names so every suggestion is something the agent can actually do.
  const TOOL_PROMPTS = {
    'read_inbox': 'Check my inbox for new messages',
    'gmail_search': 'Search my Gmail for recent emails',
    'gmail_send': 'Draft and send a Gmail message (you will confirm)',
    'news_headlines': 'Fetch today\u2019s top news headlines',
    'web_search': 'Search the web for something and summarize',
    'get_quote': 'Get a live market quote',
    'run_command': 'Run a shell command',
    'read_path': 'Read a file from disk',
    'write_file': 'Write a file',
    'list_files': 'List files in a directory',
    'search_vault': 'Search my long-term memory notes',
    'recall': 'Recall what I asked about before',
    'remember': 'Remember something important for later',
    'list_tasks': 'List my tasks',
    'add_task': 'Add a task',
    'complete_task': 'Mark a task done',
    'send_message': 'Send a message to another agent',
    'get_calendar': 'Show my calendar / proposed times',
    'atlas_status': 'Give me an ATLAS status update',
    'repo_search': 'Search the indexed ATLAS repo',
  };
  function suggestFor(ag) {
    const out = [];
    for (const t of (ag.tools || [])) {
      const p = TOOL_PROMPTS[t.name];
      if (p && out.length < 3) out.push(p);
    }
    if (!out.length && ag.name === 'orchestrator') out.push('Give me a status overview of all agents');
    return out.slice(0, 3);
  }

  // ---------- task search ----------
  let searchTimer = null;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(searchEl.value.trim()), 180);
  });
  searchEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && resultsEl.querySelector('.res-row')) {
      resultsEl.querySelector('.res-row').click();
    }
    if (e.key === 'Escape') resultsEl.classList.remove('open');
  });

  async function runSearch(q) {
    if (!q) { resultsEl.classList.remove('open'); return; }
    try {
      const r = await fetch('/api/find_agent?q=' + encodeURIComponent(q));
      const data = await r.json();
      resultsEl.innerHTML = '';
      if (!data.matches || !data.matches.length) {
        resultsEl.innerHTML = '<div class="res-row"><span class="rn" style="color:var(--text-dim)">no matching agent</span></div>';
      } else {
        for (const m of data.matches) {
          const row = document.createElement('div');
          row.className = 'res-row';
          row.innerHTML = `<span class="rn">${esc(m.name)}</span><span class="rt"><span class="sc">score ${m.score}</span> · ${esc(m.tools.join(', '))}</span>`;
          row.addEventListener('click', () => { selectAgent(m.name); });
          resultsEl.appendChild(row);
        }
      }
      resultsEl.classList.add('open');
    } catch (e) { /* keep quiet */ }
  }

  // ---------- polling ----------
  async function pollActivity() {
    try {
      const r = await fetch('/api/activity');
      const data = await r.json();
      statuses = data.agents || {};
      applyStatuses();
      pulseGraph();
    } catch (e) { /* transient */ }
  }

  // v3.0/v3.2: poll the inter-agent bus. Since= fetches ONLY messages newer
  // than the last one we animated, so every fresh message triggers a live
  // pulse on the map (neural view) / flash on the cards (grid view) + a
  // COMMS STREAM ticker row. Unread counts stay absolute (whole-bus, from
  // the same response); inbox ROWS still come from refreshSelectedInbox so
  // this poll never wipes the detail panel's inbox.
  function msgNum(id) { const m = /^msg-(\d+)$/.exec(id || ''); return m ? parseInt(m[1], 10) : 0; }

  function pushStream(msg) {
    const stream = document.getElementById('stream');
    if (!stream) return;
    const dest = msg.to === '*' ? 'ALL' : msg.to;
    const row = document.createElement('div');
    row.className = 'tic';
    row.innerHTML = `<span class="tclose">[${(msg.at || '').slice(11)}]</span> <b>${esc(msg.from)}</b> <span class="tto">→ ${esc(dest)}</span> ${esc((msg.subject || '').slice(0, 70))}`;
    stream.appendChild(row);
    while (stream.children.length > 5) stream.removeChild(stream.firstChild);
    setTimeout(() => {
      row.style.opacity = '0';
      setTimeout(() => row.remove(), 650);
    }, 5200);
  }

  function flashNode(name) {
    const el = nodeEls[name];
    if (!el) return;
    el.classList.remove('flash');
    void el.offsetWidth;  // restart the animation
    el.classList.add('flash');
  }

  function pulseTo(sx, sy, tx, ty) {
    const svg = graphEl.querySelector('svg');
    if (!svg) return;
    const NS = 'http://www.w3.org/2000/svg';
    const trail = document.createElementNS(NS, 'line');
    trail.setAttribute('class', 'pulse-trail');
    trail.setAttribute('x1', sx); trail.setAttribute('y1', sy);
    trail.setAttribute('x2', tx); trail.setAttribute('y2', ty);
    trail.setAttribute('stroke', 'var(--cyan)'); trail.setAttribute('stroke-width', '2');
    trail.setAttribute('opacity', '0.9');
    svg.appendChild(trail);
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('class', 'pulse-dot');
    dot.setAttribute('r', '5');
    dot.setAttribute('fill', 'var(--cyan)');
    svg.appendChild(dot);
    const t0 = performance.now(), dur = 650;
    function step(t) {
      const p = Math.min((t - t0) / dur, 1);
      const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const x = sx + (tx - sx) * ease, y = sy + (ty - sy) * ease;
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      trail.setAttribute('opacity', (0.9 * (1 - p)).toFixed(2));
      if (p < 1) requestAnimationFrame(step);
      else { dot.remove(); trail.remove(); }
    }
    requestAnimationFrame(step);
  }

  function animateBusMessage(msg) {
    // grid view: flash the cards involved (sender + recipients). Broadcasts
    // fan out — cap the flash like the pulses so a live agent's broadcast
    // doesn't strobe the whole grid (reviewer-caught).
    const allNames = roster.map(a => a.name);
    const recips = msg.to === '*' ? allNames.filter(n => n !== msg.from) : [msg.to];
    flashNode(msg.from);
    recips.slice(0, 12).forEach(flashNode);
    // neural view: a glowing pulse from sender to every recipient.
    if (graphView && graphPos[msg.from]) {
      const targets = recips.map(n => graphPos[n]).filter(Boolean);
      targets.slice(0, 12).forEach(t => pulseTo(graphPos[msg.from].x, graphPos[msg.from].y, t.x, t.y));
    }
    pushStream(msg);
  }

  async function pollBus() {
    try {
      const r = await fetch('/api/messages?since=msg-' + lastMsgId);
      const data = await r.json();
      // Update unread badges (absolute counts from the same response).
      const unreadAll = data.unread || {};
      for (const ag of roster) {
        const prev = inboxes[ag.name] || { inbox: [], unread: 0 };
        inboxes[ag.name] = { inbox: prev.inbox, unread: unreadAll[ag.name] || 0 };
      }
      applyStatuses();
      // Animate each NEW message (newest-first -> reverse for arrival order).
      (data.messages || []).slice().reverse().forEach(m => {
        const n = msgNum(m.id);
        if (n > lastMsgId) lastMsgId = n;
        animateBusMessage(m);
      });
    } catch (e) { /* transient */ }
  }
  function refreshSelectedInbox() {
    if (!selected) return;
    fetch('/api/agent/' + encodeURIComponent(selected)).then(r => r.json()).then(d => {
      inboxes[selected] = { inbox: d.inbox || [], unread: d.unread || 0 };
      applyInboxBadge(selected);
      const snap = JSON.stringify(statuses[selected] || {}) + JSON.stringify(inboxes[selected] || {});
      if (snap !== lastRenderedSnap) { lastRenderedSnap = snap; renderDetail(); }
    }).catch(() => {});
  }

  // ---------- neural link graph ----------
  let graphData = { nodes: [], edges: [] };
  let graphView = false;
  const graphEl = document.getElementById('graph');
  const nodesWrap = document.getElementById('nodes');

  document.querySelectorAll('.vt').forEach(btn => {
    btn.addEventListener('click', () => {
      graphView = btn.dataset.view === 'neural';
      document.querySelectorAll('.vt').forEach(b => b.classList.toggle('active', b === btn));
      nodesWrap.style.display = graphView ? 'none' : '';
      graphEl.style.display = graphView ? '' : 'none';
      if (graphView) renderGraph();
    });
  });

  function renderGraph() {
    if (!graphData.nodes.length) {
      graphEl.innerHTML = '<div class="dempty">no link topology — is /api/links up?</div>';
      return;
    }
    const W = graphEl.clientWidth || 900;
    const H = Math.max(graphEl.clientHeight || 560, 520);
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) / 2 - 90;

    // Position: orchestrator at center; memory as inner hub; others on a
    // ring grouped by domain sectors (deterministic, no force sim).
    const pos = {};
    pos['orchestrator'] = { x: cx, y: cy, r: 26 };
    const mem = graphData.nodes.find(n => n.name === 'memory');
    if (mem) pos['memory'] = { x: cx, y: cy + 42, r: 20 };

    const ring = graphData.nodes.filter(n => n.name !== 'orchestrator' && n.name !== 'memory');
    const byDomain = {};
    ring.forEach(n => { (byDomain[n.domain] = byDomain[n.domain] || []).push(n); });
    const domains = Object.keys(byDomain);
    const total = ring.length || 1;
    let start = -Math.PI / 2;
    const SECTOR_GAP = 0.14;
    domains.forEach((dom, di) => {
      const frac = byDomain[dom].length / total;
      const span = frac * Math.PI * 2 - SECTOR_GAP;
      const step = span / Math.max(byDomain[dom].length, 1);
      byDomain[dom].forEach((n, i) => {
        const a = start + (i + 0.5) * step;
        pos[n.name] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), r: 22 };
      });
      start += frac * Math.PI * 2;
    });

    // v3.2: remember node positions so bus pulses can travel between agents.
    graphPos = {};
    for (const k of Object.keys(pos)) graphPos[k] = { x: pos[k].x, y: pos[k].y };

    let svg = `<svg viewBox="0 0 ${W} ${H}">`;
    const kindColor = { delegate: 'var(--line-strong)', memory: 'var(--line-strong)', peer: 'var(--dead)' };
    for (const e of graphData.edges) {
      const s = pos[e.source], t = pos[e.target];
      if (!s || !t) continue;
      svg += `<line class="g-link ${e.kind}" data-src="${esc(e.source)}" data-tgt="${esc(e.target)}"
        x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}"
        stroke="${kindColor[e.kind] || 'var(--dead)'}" stroke-width="1" stroke-dasharray="${e.kind === 'delegate' ? '4 5' : ''}"/>`;
    }
    for (const n of graphData.nodes) {
      const p = pos[n.name];
      if (!p) continue;
      // v5.2: node tooltip carries the agent's real description (the graph
      // view hides it — hovering shows what the agent actually does).
      const tip = esc((n.description || '').slice(0, 140));
      svg += `<g class="g-node" data-name="${esc(n.name)}" transform="translate(${p.x},${p.y})">
        <title>${tip}</title>
        <circle r="${p.r}" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="2"/>
        <text y="-8" text-anchor="middle" class="glabel">${esc(n.domain)}</text>
        <text y="7" text-anchor="middle">${esc(n.name)}</text>
        <text y="${p.r + 15}" text-anchor="middle" class="glabel">${n.tool_count} tools</text>
      </g>`;
    }
    svg += '</svg>';
    graphEl.innerHTML = svg;

    // v5.2: a live description strip under the graph follows the hovered
    // node, so the neural view is self-explaining without the detail panel.
    graphEl.querySelectorAll('.g-node').forEach(g => {
      g.addEventListener('click', () => selectAgent(g.dataset.name));
      g.addEventListener('mouseenter', () => {
        const ag = graphData.nodes.find(n => n.name === g.dataset.name);
        const strip = document.getElementById('graphstrip');
        if (strip && ag) {
          strip.textContent = ag.name + ' — ' + ag.description;
          strip.style.opacity = '1';
        }
      });
      g.addEventListener('mouseleave', () => {
        const strip = document.getElementById('graphstrip');
        if (strip) strip.style.opacity = '0';
      });
    });
    pulseGraph();
  }

  function pulseGraph() {
    if (!graphView) return;
    const activeNames = new Set(
      Object.entries(statuses).filter(([, st]) => st.status === 'computing').map(([n]) => n)
    );
    graphEl.querySelectorAll('.g-link').forEach(l => {
      l.classList.toggle('active', activeNames.has(l.dataset.src) || activeNames.has(l.dataset.tgt));
    });
    graphEl.querySelectorAll('.g-node').forEach(g => {
      g.classList.toggle('active', activeNames.has(g.dataset.name));
      g.classList.toggle('selected', g.dataset.name === selected);
    });
  }

  // ---------- boot ----------
  fetch('/api/roster').then(r => r.json()).then(data => {
    roster = data.subagents;
    renderNodes();
    pollActivity();
    pollBus();
    setInterval(pollActivity, 1000);
    setInterval(pollBus, 1000);
    setInterval(refreshSelectedInbox, 2500);
  }).catch(() => { nodesEl.innerHTML = '<div class="dempty">ROSTER OFFLINE — is the server running?</div>'; });

  fetch('/api/links').then(r => r.json()).then(data => {
    graphData = data;
    if (graphView) renderGraph();
  }).catch(() => { /* graph stays empty; grid still works */ });
})();
</script>
</body>
</html>
