<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ground plate -->
  <rect width="512" height="512" rx="112" fill="#12151E"/>
  <!-- hairline cyan frame -->
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="#4FC3F7" stroke-opacity="0.22" stroke-width="10"/>
  <!-- radar ring: 270-degree arc, gap at top (stroke starts at 3 o'clock,
       dash = 270deg of circumference(150) ~ 707, gap ~ 236) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#4FC3F7" stroke-width="26" stroke-linecap="round" stroke-dasharray="707 236"/>
  <!-- sweep head at the arc's end (12 o'clock) -->
  <circle cx="256" cy="106" r="24" fill="#4FC3F7"/>
  <!-- gold core: the system's self-portrait (gold is used nowhere else) -->
  <circle cx="256" cy="256" r="34" fill="#FFD232"/>
</svg>
