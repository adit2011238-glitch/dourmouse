<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALL HANDS // EVERY RESOURCE</title>
<link rel="stylesheet" href="/assets/dourmouse-ui.css">
<style>
  /* v13.6: real Fira Sans, bundled locally (ui/assets/fonts/, OFL-licensed)
     — replaces --font-prose's previous "Inter" entry below, which was
     never actually bundled anywhere in this codebase and silently fell
     through to -apple-system on every real machine. Genuine fix. */
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:300;font-display:swap;
    src:url('/assets/fonts/fira-sans-300-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;font-display:swap;
    src:url('/assets/fonts/fira-sans-400-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:italic;font-weight:400;font-display:swap;
    src:url('/assets/fonts/fira-sans-400-italic-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:500;font-display:swap;
    src:url('/assets/fonts/fira-sans-500-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;font-display:swap;
    src:url('/assets/fonts/fira-sans-600-latin.woff2') format('woff2')}
  @font-face{font-family:'Fira Sans';font-style:normal;font-weight:700;font-display:swap;
    src:url('/assets/fonts/fira-sans-700-latin.woff2') format('woff2')}
  /* Retheme to the shared terminal-IDE design system (assets/dourmouse-ui.css,
     linked above). Same method as ui/workspace.html: variable NAMES are
     unchanged, so all 80 call sites keep working and this is one block to
     revert.

       - --text/--text-dim/--line/--line-strong were rgba(cyan) over the
         ground, which is what made every rule and every "white" glyph on
         this page faintly cyan. They are now four solid neutrals.
       - --surface was #0E1420 and was, in practice, always used through an
         rgba() at the call sites (rgba(14,20,32,.7) etc). Those call sites
         are now flat layers, and --raised is NEW (additive) for the
         interactive/hover layer this palette had no name for.
       - --cyan stops being a hue and becomes the neutral primary text
         colour. Amber/green/red survive only as the three functional
         accents (active / ok / error), never as decoration.
       - The alpha ladder is kept and still defined -- a couple of opacity
         call sites read it -- but no surface is composited from it.
       - Type goes mono-first: Departure Mono for structure, Monaspace Neon
         for everything the machine says, prose included.

     Previous values, for a one-step revert:
       --ground:#070B12; --surface:#0E1420;
       --cyan:#4FC3F7/79,195,247; --green:#26D07C/38,208,124;
       --amber:#F5A623/245,166,35; --red:#EF5350/239,83,80;
       --dead:#8A929E/138,146,158;
       --text:rgba(cyan,.85); --text-dim:rgba(cyan,.45);
       --line:rgba(cyan,.10); --line-strong:rgba(cyan,.30);
       --font-display:"Exo 2"...; --font-mono:"JetBrains Mono"...;
       --font-prose:"Fira Sans"...                                        */
  :root {
    --ground: #09090B; --surface: #18181B; --raised: #27272A;
    --cyan:  #FAFAFA; --cyan-rgb:  250,250,250;
    --green: #10B981; --green-rgb: 16,185,129;
    --amber: #F59E0B; --amber-rgb: 245,158,11;
    --red:   #EF4444; --red-rgb:   239,68,68;
    --dead:  #52525B; --dead-rgb:  82,82,91;
    --a06:0.06; --a10:0.10; --a16:0.16; --a30:0.30; --a45:0.45; --a60:0.60; --a85:0.85;
    --font-display: 'Departure Mono','Commit Mono','Intel One Mono',ui-monospace,monospace;
    --font-mono: 'Berkeley Mono','Monaspace Neon','JetBrains Mono NL','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --font-prose: 'Berkeley Mono','Monaspace Neon','JetBrains Mono',ui-monospace,monospace;
    --text: #FAFAFA;
    --text-dim: #71717A;
    --text-body: #A1A1AA;
    --line: #27272A;
    --line-strong: #3F3F46;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  /* Two radial washes and a top-to-bottom gradient used to sit here. All
     three were decoration; the ground is now one flat colour. */
  body {
    background: var(--ground);
    color: var(--text-body); font-family: var(--font-prose); font-size: 13px;
    overflow-y: auto;
  }
  /* The 44px workbench grid stays -- a bench grid is a real terminal idiom,
     not ornament -- but it is a crisp solid rule at the structural layer
     colour now instead of a 2.5%-alpha cyan smear. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--surface) 1px, transparent 1px),
      linear-gradient(90deg, var(--surface) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: var(--surface);
    position: sticky; top: 0; z-index: 5;
  }
  /* The mark was a radial-gradient disc with an 18px cyan halo. It is now a
     flat 2px-cornered tile on the interactive layer. */
  .mark {
    width: 34px; height: 34px; flex: none;
    border: 1px solid var(--line); border-radius: 2px;
    display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 400; font-size: 14px; color: var(--text-dim);
    background: var(--raised);
  }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 2px;
       color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  h1 .dim { color: var(--text-dim); font-weight: 400; }
  .status { margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .status .live { color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
  /* Status is a solid dot. The 8px green halo is gone; the opacity pulse
     stays (opacity only -- it cannot force layout). */
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
         animation: pulse 2s infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .goal { padding: 16px 20px 4px; }
  .goal .g-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); }
  .goal h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-top: 4px; line-height: 1.4; }
  .goal .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px 20px; }
  .card {
    border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px;
    background: var(--surface); position: relative; overflow: hidden;
  }
  /* Card borders no longer carry the status colour. There are exactly two
     line values in this system, and every card already shows its state in
     the badge two lines below, in the same card head. A running card is
     lifted onto the interactive layer instead -- ground, not hue. */
  .card.running { background: var(--raised); border-color: var(--line-strong); }
  .card.done, .card.error { border-color: var(--line-strong); }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head .bname { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 1px;
    color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* One pill shape, one monochrome ground, no coloured borders. The four
     variants keep a text colour because these are not tags -- they are the
     run's state, and they use exactly the system's three functional accents
     (active / ok / error) with "pending" left dim. */
  .badge {
    margin-left: auto; flex: none; font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;
    padding: 2px 8px; border-radius: 2px; border: 1px solid transparent;
    background: var(--raised); color: var(--text-dim); white-space: nowrap;
  }
  .badge.pending { color: var(--dead); }
  .badge.running { color: var(--amber); }
  .badge.done { color: var(--green); }
  .badge.error { color: var(--red); }
  .card .body { font-family: var(--font-mono); font-size: 11px; line-height: 1.6; color: var(--text-body);
                max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .card .body.err { color: var(--red); }
  .card .elapsed { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 8px; }

  /* Was a 5%-alpha green fill inside a 40%-alpha green border: a tinted
     card floating on the page. It is a flat panel now, and "settled" is
     carried by the one green label instead of by the whole surface. */
  .synth { margin: 6px 20px 16px; border: 1px solid var(--line); border-radius: 2px;
           padding: 16px 18px; background: var(--surface); }
  .synth .s-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--green); margin-bottom: 8px; }
  .synth .s-body { font-size: 13px; line-height: 1.7; color: var(--text-body); white-space: pre-wrap; word-break: break-word; }
  .synth .s-err { color: var(--red); }

  .new-run { margin: 16px 20px; display: flex; gap: 10px; }
  .new-run input {
    flex: 1 1 auto; min-width: 0; background: var(--ground); border: 1px solid var(--line);
    color: var(--text); font-family: var(--font-mono); font-size: 12px;
    padding: 10px 12px; border-radius: 2px; outline: none;
  }
  .new-run input:focus { border-color: var(--line-strong); }
  button {
    font-family: var(--font-display); font-size: 11px; letter-spacing: 1px; flex: none;
    color: var(--text-body); background: var(--surface);
    border: 1px solid var(--line); border-radius: 2px; padding: 9px 16px; cursor: pointer;
    white-space: nowrap;
    transition: background-color 200ms, color 200ms, border-color 200ms;
  }
  button:hover { background: var(--raised); color: var(--text); border-color: var(--line-strong); }

  .runs { padding: 6px 20px 20px; }
  .runs .r-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 8px; }
  .run-row {
    display: flex; gap: 10px; align-items: center; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 2px; margin-bottom: 6px; cursor: pointer;
    background: var(--surface);
    transition: background-color 200ms;
  }
  .run-row:hover { background: var(--raised); border-color: var(--line-strong); }
  .run-row .r-goal { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-row .r-meta { flex: none; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-family: var(--font-mono); }
</style>
</head>
<body>
<header>
  <div class="mark">⚡</div>
  <h1>ALL HANDS <span class="dim">// EVERY RESOURCE</span></h1>
  <div class="status">
    <span class="live" id="live"><span class="dot"></span>LIVE</span>
    <span id="runmeta"></span>
  </div>
</header>

<div class="goal" id="goalbox" style="display:none">
  <div class="g-label">GOAL</div>
  <h2 id="goal"></h2>
  <div class="meta" id="meta"></div>
</div>

<div class="new-run" id="newrun">
  <input id="goalinput" placeholder="Give me a goal and I'll put every resource on it — e.g. research the EV charging market and recommend 3 plays" spellcheck="false">
  <button id="startbtn">⚡ ALL HANDS</button>
</div>

<div class="grid" id="grid"></div>
<div class="synth" id="synth" style="display:none">
  <div class="s-label">SYNTHESIS — MERGED BY THE FAST HOSTED BRAIN</div>
  <div class="s-body" id="synthbody"></div>
</div>

<div class="runs" id="runsbox" style="display:none">
  <div class="r-title">RECENT RUNS</div>
  <div id="runslist"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let runId = (params.get("run") || "").trim();
let current = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const BRAIN_LABELS = { claude: "CLAUDE", nvidia: "NVIDIA", deepseek: "DEEPSEEK", codex: "CHATGPT/CODEX", web: "WEB SEARCH" };

function cardHTML(key, b) {
  const badge = `<span class="badge ${b.status}">${esc(b.status.toUpperCase())}</span>`;
  let body = '';
  if (b.status === 'pending') body = '<span style="color:var(--dead)">queued…</span>';
  else if (b.status === 'running') body = '<span style="color:var(--amber)">working…</span>';
  else if (b.status === 'done') body = esc((b.result || '')).slice(0, 2400);
  else if (b.status === 'error') body = esc(b.error || 'failed');
  const elapsed = b.elapsed !== null && b.elapsed !== undefined ? b.elapsed + 's' : '—';
  return `<div class="card ${b.status}" data-k="${esc(key)}">
    <div class="card-head"><span class="bname">${esc(BRAIN_LABELS[key] || key)}</span>${badge}</div>
    <div class="body ${b.status === 'error' ? 'err' : ''}">${body}</div>
    <div class="elapsed">ELAPSED ${esc(String(elapsed))}</div>
  </div>`;
}

function renderRun(run) {
  current = run;
  if (!run) return;
  $("goalbox").style.display = "block";
  $("goal").textContent = run.goal;
  const st = run.status.toUpperCase();
  const when = run.started ? new Date(run.started).toLocaleTimeString() : "";
  $("meta").textContent = `RUN ${run.id} · ${st} · STARTED ${when}` + (run.owner ? ` · OWNER ${run.owner}` : "");
  $("live").style.display = run.status === "running" ? "" : "none";
  $("grid").innerHTML = Object.entries(run.brains || {}).map(([k, b]) => cardHTML(k, b)).join("");
  const syn = $("synth");
  if (run.synthesis) {
    syn.style.display = "block";
    $("synthbody").className = "s-body";
    $("synthbody").textContent = run.synthesis;
  } else if (run.error) {
    syn.style.display = "block";
    $("synthbody").className = "s-body s-err";
    $("synthbody").textContent = run.error;
  } else {
    syn.style.display = "none";
  }
}

async function fetchRun(id) {
  try {
    const r = await fetch("/api/allhands/" + encodeURIComponent(id), { cache: "no-store" });
    const d = await r.json();
    if (d.ok && d.run) renderRun(d.run);
  } catch (e) { /* transient — the SSE/poll retries */ }
}

async function fetchRuns() {
  try {
    const r = await fetch("/api/allhands", { cache: "no-store" });
    const d = await r.json();
    const runs = (d.runs || []).slice(0, 8);
    if (!runs.length) return;
    $("runsbox").style.display = "block";
    $("runslist").innerHTML = runs.map((run) => `
      <div class="run-row" data-id="${esc(run.id)}">
        <span class="r-goal">${esc(run.goal)}</span>
        <span class="r-meta">${esc(run.status.toUpperCase())} · ${Object.values(run.brains || {}).filter(b => b.status === 'done').length}/${Object.values(run.brains || {}).length}</span>
      </div>`).join("");
    document.querySelectorAll(".run-row").forEach((el) => el.addEventListener("click", () => {
      runId = el.dataset.id;
      history.replaceState(null, "", "/all-hands?run=" + encodeURIComponent(runId));
      fetchRun(runId);
      $("newrun").style.display = "none";
    }));
  } catch (e) { /* window may be offline */ }
}

// Live SSE: the same hub the HUD listens on; filter allhands events for
// this run. Poll every 2s as the always-on fallback (SSE may lag a re-open).
function connectSSE() {
  try {
    const es = new EventSource("/api/events");
    es.onmessage = (ev) => {
      let d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.type === "allhands" && (!runId || d.run_id === runId)) {
        if (!runId && d.run_id) { runId = d.run_id; history.replaceState(null, "", "/all-hands?run=" + encodeURIComponent(runId)); }
        fetchRun(d.run_id);
        fetchRuns();
      }
    };
    es.onerror = () => es.close(); // poll covers it; EventSource retries anyway
  } catch (e) { /* SSE unavailable — poll only */ }
}

$("startbtn").addEventListener("click", async () => {
  const goal = $("goalinput").value.trim();
  if (!goal) return;
  $("startbtn").disabled = true;
  try {
    const r = await fetch("/api/allhands", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal }),
    });
    const d = await r.json();
    if (d.ok) {
      runId = d.run_id;
      history.replaceState(null, "", "/all-hands?run=" + encodeURIComponent(runId));
      $("newrun").style.display = "none";
      fetchRun(runId);
      if (window.pywebview && window.pywebview.api && window.pywebview.api.open_all_hands) {
        window.pywebview.api.open_all_hands(d.run_id, goal);
      }
    }
  } catch (e) {
    $("runmeta").textContent = "⚠ could not start: " + e;
  }
  $("startbtn").disabled = false;
});
$("goalinput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("startbtn").click(); });

if (runId) {
  $("newrun").style.display = "none";
  fetchRun(runId);
  // Poll only while the run is live — a finished run stays rendered from
  // its final snapshot (reviewer: no pointless requests on an idle window).
  setInterval(() => {
    if (!current || current.status === "running") fetchRun(runId);
  }, 2000);
}
fetchRuns();
setInterval(fetchRuns, 15000);
connectSSE();
</script>
</body>
</html>
