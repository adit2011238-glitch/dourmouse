<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Preview</title>
<style>
  /* 2026-09-14, real live-caught gap: "There's no 'Dourmouse preview'
     pane that can display a PDF inline" -- open_path's only real
     option was shelling out to macOS `open` (Preview.app, a second,
     separate window). This page is that missing surface: a small,
     standalone preview embedded in the SAME browser pane every other
     open_browser_pane result already uses, for either an arbitrary
     absolute path (?src=files) or a real file inside the study folder
     (?src=study). PDF paging reuses the exact same real PDFium
     rendering (dourmouse/pdf_reader.py) already proven in
     ui/workspace.html's Vision OS PDF READER panel -- same routes,
     different (or no) sandbox root, one already-tested backend.
  */
  :root{color-scheme:light dark}
  html,body{margin:0;padding:0;height:100%;background:#0e0e10;color:#e8e8ea;
    font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;
    background:#17171a;border-bottom:1px solid #2a2a2e;position:sticky;top:0}
  .bar .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    opacity:.85}
  .bar button{background:#232327;color:#e8e8ea;border:1px solid #33333a;
    border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
  .bar button:disabled{opacity:.35;cursor:default}
  .bar .page{opacity:.7;min-width:70px;text-align:center}
  .stage{display:flex;flex-direction:column;align-items:center;padding:16px;
    gap:12px}
  .stage img{max-width:100%;box-shadow:0 2px 16px rgba(0,0,0,.4);
    background:#fff}
  /* 2026-09-23 (OS-1, the embedded media player). A real <audio>/<video>
     element, not a remote-control panel: this is the first actual media
     playback anywhere in Dourmouse. Byte-range seeking is handled by
     /api/files/media server-side; all this needs to do is not fight the
     element's own native controls. */
  .stage video{max-width:100%;max-height:78vh;background:#000;
    box-shadow:0 2px 16px rgba(0,0,0,.4)}
  .stage audio{width:min(560px,100%)}
  .msg{padding:24px;opacity:.75}
  .err{color:#ff8a80}
  .hint{padding:0 24px 8px;opacity:.6;font-size:12px;max-width:560px;
    text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="bar">
  <span class="name" id="name">—</span>
  <span class="page" id="pageLabel" hidden></span>
  <button type="button" id="prev" hidden>◀</button>
  <button type="button" id="next" hidden>▶</button>
</div>
<div class="stage" id="stage"><div class="msg">Loading…</div></div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var src = qs.get("src") === "study" ? "study" : "files";
  var path = qs.get("path") || "";
  var prefix = src === "study" ? "/api/study" : "/api/files";
  var pathParam = src === "study" ? "path" : "path";
  var nameEl = document.getElementById("name");
  var stage = document.getElementById("stage");
  var pageLabel = document.getElementById("pageLabel");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var ext = (path.split(".").pop() || "").toLowerCase();
  var isPdf = ext === "pdf";
  // Kept deliberately in step with webui.py's _PREVIEWABLE_AUDIO_EXTS /
  // _PREVIEWABLE_VIDEO_EXTS. A container a browser cannot natively decode
  // (.mkv, .avi, .flac, .wmv) is NOT listed on either side, so it reaches the
  // honest "cannot be played here" branch below instead of rendering a player
  // that silently shows nothing.
  var AUDIO_EXTS = ["mp3","m4a","aac","wav","oga","ogg","opus","weba"];
  var VIDEO_EXTS = ["mp4","m4v","webm","ogv","mov"];
  var IMAGE_EXTS = ["png","jpg","jpeg","gif","webp","svg","bmp"];
  // OS-10 (finding #117): these play after the server converts them with
  // ffmpeg (a remux when only the container is wrong). Kept in step with
  // dourmouse/media_convert.py's CONVERT_* sets.
  var CONVERT_VIDEO = ["mkv","avi","wmv","flv","mpg","mpeg","ts","m2ts","mts","3gp","vob","divx","asf","f4v"];
  var CONVERT_AUDIO = ["flac","wma","aiff","aif","ac3","dts","amr","ape","mka","alac","caf"];
  var needsConvert = CONVERT_VIDEO.indexOf(ext) !== -1 || CONVERT_AUDIO.indexOf(ext) !== -1;
  var isAudio = AUDIO_EXTS.indexOf(ext) !== -1 || CONVERT_AUDIO.indexOf(ext) !== -1;
  var isVideo = VIDEO_EXTS.indexOf(ext) !== -1 || CONVERT_VIDEO.indexOf(ext) !== -1;
  var isImage = IMAGE_EXTS.indexOf(ext) !== -1;
  var displayName = path.split("/").pop() || path;
  nameEl.textContent = displayName;
  document.title = displayName;

  function fetchJson(url){
    return fetch(url).then(function(r){ return r.json(); });
  }

  if (!path) {
    stage.innerHTML = '<div class="msg err">No file path given.</div>';
  } else if (isPdf) {
    var state = { page: 0, pageCount: 0 };
    function loadPage(){
      var img = document.createElement("img");
      img.alt = "page " + (state.page + 1);
      img.src = prefix + "/pdf-page.png?" + pathParam + "=" + encodeURIComponent(path) +
        "&page=" + state.page + "&t=" + Date.now();
      stage.innerHTML = "";
      stage.appendChild(img);
      pageLabel.hidden = false;
      pageLabel.textContent = "page " + (state.page + 1) + " / " + state.pageCount;
      prevBtn.hidden = false;
      nextBtn.hidden = false;
      prevBtn.disabled = state.page <= 0;
      nextBtn.disabled = state.page >= state.pageCount - 1;
    }
    fetchJson(prefix + "/pdf-info?" + pathParam + "=" + encodeURIComponent(path))
      .then(function(info){
        if (!info.ok) {
          stage.innerHTML = '<div class="msg err">' +
            (info.error || "could not open this PDF") + "</div>";
          return;
        }
        state.pageCount = info.page_count;
        loadPage();
      })
      .catch(function(){
        stage.innerHTML = '<div class="msg err">Could not reach the preview server.</div>';
      });
    prevBtn.addEventListener("click", function(){
      if (state.page > 0) { state.page--; loadPage(); }
    });
    nextBtn.addEventListener("click", function(){
      if (state.page < state.pageCount - 1) { state.page++; loadPage(); }
    });
  } else if (isAudio || isVideo) {
    var statusUrl = prefix + "/media-status?" + pathParam + "=" + encodeURIComponent(path);
    function startPlayer(info){
    // No cache-busting timestamp here, unlike the image and PDF-page routes:
    // /api/files/media answers real range requests and is served cacheable on
    // purpose, and a URL that changes every load would defeat both.
    var media = document.createElement(isVideo ? "video" : "audio");
    media.controls = true;
    media.preload = "metadata";
    media.src = prefix + "/media?" + pathParam + "=" + encodeURIComponent(path);
    // Sidecar subtitles (movie.srt / movie.en.srt next to the file).
    ((info && info.subtitles) || []).forEach(function(s, i){
      var t = document.createElement("track");
      t.kind = "subtitles"; t.label = s.label; t.src = s.url; if (i === 0) t.default = true;
      media.appendChild(t);
    });
    // Remember where playback stopped, per file.
    var posKey = "dm_media_pos:" + path;
    media.addEventListener("loadedmetadata", function(){
      try {
        var at = parseFloat(localStorage.getItem(posKey) || "0");
        if (at > 5 && at < media.duration - 5) media.currentTime = at;
      } catch (e) {}
    });
    var lastSave = 0;
    media.addEventListener("timeupdate", function(){
      if (Date.now() - lastSave < 2000) return;
      lastSave = Date.now();
      try { localStorage.setItem(posKey, String(media.currentTime)); } catch (e) {}
    });
    media.addEventListener("ended", function(){ try { localStorage.removeItem(posKey); } catch (e) {} });
    media.onerror = function(){
      // Report what the browser actually said rather than a generic line.
      // MEDIA_ERR_SRC_NOT_SUPPORTED (4) is deliberately NOT described as "the
      // codec is unsupported": a browser raises the same code 4 when the
      // server refused the URL outright, and a real live test hit exactly
      // that (a mistyped path returned 400 and surfaced as code 4). Naming
      // one cause when there are two would be a guess presented as a
      // diagnosis, so both are stated and the way to tell them apart is
      // given.
      var codes = {1:"playback was stopped",
                   2:"a network error interrupted it",
                   3:"its contents could not be decoded"};
      var err = media.error;
      var code = err ? err.code : 0;
      var why = codes[code] || "the browser would not accept it";
      var hint;
      if (code === 4 || !err) {
        hint = 'Two things produce this: the file\'s codec is one this ' +
               'browser cannot decode, or the server refused the path. ' +
               'Open the URL below directly to tell them apart \u2014 a 400 ' +
               'means the path, anything else means the codec. Either way, ' +
               'open_path will open this file in the real default app.';
      } else {
        hint = 'Use open_path to open this file in the real default app.';
      }
      stage.innerHTML = '<div class="msg err">Could not play ' + displayName +
        ": " + why + '.</div><div class="hint">' + hint +
        '<br><br><code style="opacity:.8;word-break:break-all">' +
        media.src.replace(/</g, "&lt;") + '</code></div>';
    };
    stage.innerHTML = "";
    stage.appendChild(media);
    }
    function poll(){
      fetchJson(statusUrl).then(function(info){
        if (info.state === "ready") { startPlayer(info); return; }
        if (info.state === "failed") {
          stage.innerHTML = '<div class="msg err">Could not play ' + displayName + '.</div><div class="hint">' +
            String(info.error || "").replace(/</g, "&lt;") + '</div>';
          return;
        }
        var pct = Math.round((info.progress || 0) * 100);
        stage.innerHTML = '<div class="msg">' + (info.route === "remux"
          ? "Preparing " + displayName + " (repackaging, no quality change)\u2026"
          : "Converting " + displayName + " for playback\u2026 " + pct + "%") + '</div>';
        setTimeout(poll, 700);
      }).catch(function(){
        stage.innerHTML = '<div class="msg err">Could not reach the preview server.</div>';
      });
    }
    if (needsConvert) { poll(); }
    else { fetchJson(statusUrl).then(startPlayer).catch(function(){ startPlayer(null); }); }
  } else if (isImage) {
    var img = document.createElement("img");
    img.alt = displayName;
    img.onerror = function(){
      stage.innerHTML = '<div class="msg err">Could not load this image.</div>';
    };
    img.src = prefix + "/image?" + pathParam + "=" + encodeURIComponent(path) + "&t=" + Date.now();
    stage.innerHTML = "";
    stage.appendChild(img);
  } else {
    // An honest dead end, not a blank player. Reaching here means the file is
    // genuinely outside what a browser can render natively.
    stage.innerHTML = '<div class="msg err">' + displayName +
      ' cannot be previewed here.</div><div class="hint">This pane renders ' +
      'PDFs, images, and audio/video in formats a browser can decode ' +
      'natively. Use open_path to open this file in the real default app.</div>';
  }
})();
</script>
</body>
</html>
