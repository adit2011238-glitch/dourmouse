<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOURMOUSE OS · interactive mockup</title>
<!-- 2026-09-23, finding #080. An INTERACTIVE PROTOTYPE, not a picture, and
     not wired to anything. All 20 real screens from console.html's own
     SCREENS array, each with realistic content. Every interactive element
     carries a data-spec attribute describing exactly what it does; press A
     or use the SPEC button to overlay those on screen.
     It fetches nothing and writes nothing. Numbers shown are real observed
     values from this machine so layouts are judged against real content. -->
<link rel="stylesheet" href="/assets/dourmouse-ui.css">
<link rel="stylesheet" href="/assets/dourmouse-os.css">
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#071d18;color:var(--dm-fg);
    font-family:var(--dm-font-sans);-webkit-font-smoothing:antialiased}
  #dmSpotifyWidget{display:none !important}
  #shell{position:fixed;inset:28px 0 92px 0;z-index:1;display:flex;gap:12px;padding:12px}
  #sidebar{width:176px;flex:0 0 auto;display:flex;flex-direction:column;gap:2px;
    padding:8px;border-radius:var(--os-radius-panel);
    background:var(--os-mat-thin);-webkit-backdrop-filter:var(--os-blur-thin);
    backdrop-filter:var(--os-blur-thin);border:1px solid var(--os-edge-lo);
    box-shadow:var(--os-elev-rest);overflow:auto}
  .navitem{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;
    border:none;background:transparent;cursor:pointer;width:100%;text-align:left;
    font-family:var(--dm-font-sans);font-size:var(--dm-text-xs);letter-spacing:.06em;
    color:var(--dm-fg-dim);transition:background var(--os-dur-fast) linear,color var(--os-dur-fast) linear}
  .navitem:hover{background:rgba(255,255,255,.07);color:var(--dm-fg)}
  .navitem[aria-current="true"]{background:rgba(245,158,11,.15);color:var(--dm-active)}
  .navitem .ni{width:15px;height:15px;flex:0 0 auto;opacity:.75}
  .navitem:hover .ni,.navitem[aria-current="true"] .ni{opacity:1}
  .navitem .nd{width:5px;height:5px;border-radius:999px;background:var(--dm-ok);flex:0 0 auto;opacity:0}
  .navitem[data-live="1"] .nd{opacity:1}
  #stage{flex:1;min-width:0;display:flex;flex-direction:column;
    border-radius:var(--os-radius-window);background:var(--os-mat-regular);
    -webkit-backdrop-filter:var(--os-blur-regular);backdrop-filter:var(--os-blur-regular);
    border:1px solid var(--os-edge-lo);box-shadow:var(--os-elev-raise);overflow:hidden}
  #stagebar{display:flex;align-items:center;gap:10px;height:34px;flex:0 0 auto;
    padding:0 12px;border-bottom:1px solid var(--os-edge-lo);
    background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,0))}
  #stagetitle{font-size:var(--dm-text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dm-fg)}
  #stagesub{font-size:var(--dm-text-2xs);color:var(--dm-fg-dim);letter-spacing:.04em}
  #body{flex:1;overflow:auto;padding:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{border-radius:var(--os-radius-panel);background:rgba(255,255,255,.04);
    border:1px solid var(--os-edge-lo);padding:12px}
  .lbl{font-size:var(--dm-text-2xs);letter-spacing:.1em;text-transform:uppercase;
    color:var(--dm-fg-label);margin-bottom:8px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:var(--dm-text-sm);color:var(--dm-fg-body)}
  .kv b{color:var(--dm-fg);font-weight:500;font-variant-numeric:tabular-nums}
  .muted{color:var(--dm-fg-dim);font-size:var(--dm-text-sm);line-height:1.6}
  .big{font-family:var(--dm-font-mono);font-size:var(--dm-text-2xl);color:var(--dm-fg);
    font-variant-numeric:tabular-nums;line-height:1.1}
  .tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:var(--dm-text-2xs);
    letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--os-edge-lo);
    color:var(--dm-fg-body);margin:0 4px 4px 0}
  .tag.ok{color:var(--dm-ok);border-color:rgba(16,185,129,.4)}
  .tag.warn{color:var(--dm-active);border-color:rgba(245,158,11,.4)}
  .tag.bad{color:var(--dm-error);border-color:rgba(239,68,68,.4)}
  .composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--os-edge-lo);
    background:rgba(0,0,0,.2);flex:0 0 auto}
  .who{font-size:var(--dm-text-2xs);letter-spacing:.1em;text-transform:uppercase;
    color:var(--dm-fg-label);margin-bottom:4px}
  .turn{margin-bottom:14px}
  .turn .you{color:var(--dm-fg)}
  .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--dm-active);border-radius:999px}
  #specbar{position:fixed;left:12px;bottom:12px;z-index:940;display:flex;gap:8px;align-items:center}
  #speclegend{font-size:var(--dm-text-2xs);color:var(--dm-fg-dim);letter-spacing:.04em}
  .empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--dm-fg-dim);
    font-size:var(--dm-text-sm);line-height:1.7}
  #wallpicker{position:fixed;top:34px;left:92px;z-index:960;width:248px;padding:12px;
    border-radius:var(--os-radius-widget);background:var(--os-mat-thick);
    -webkit-backdrop-filter:var(--os-blur-thick);backdrop-filter:var(--os-blur-thick);
    border:1px solid var(--os-edge-lo);box-shadow:var(--os-elev-modal)}
  .wp-head{font-size:var(--dm-text-2xs);letter-spacing:.1em;text-transform:uppercase;
    color:var(--dm-fg-label);margin-bottom:8px}
  .wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .wp{height:42px;border-radius:8px;border:1px solid var(--os-edge-lo);cursor:pointer;
    transition:transform var(--os-dur) var(--os-spring),border-color var(--os-dur-fast) linear}
  .wp:hover{transform:translateY(-2px)}
  .wp[aria-current="true"]{border-color:var(--dm-active);border-width:2px}
  .wp-row{display:flex;align-items:center;gap:8px;margin-top:10px;
    font-size:var(--dm-text-sm);color:var(--dm-fg-body)}
  .wp-row span{flex:1}
  .wp-row input[type=range]{width:96px;accent-color:var(--dm-active)}
  /* The dim layer sits between the photo and the UI. Without it, body copy
     over a bright photo drops below 4.5:1 and the shell becomes unreadable. */
  #walldim{position:fixed;inset:0;z-index:0;pointer-events:none;background:#000;opacity:.35}
  /* ---- agent office ------------------------------------------------
     Four statuses, and each is a real ActivityTracker value rather than a
     mood: idle (no current call), work (a tool call in flight), live (an
     always-on poller), meet (in a delegate_parallel fan-out). */
  .floor{display:grid;grid-template-columns:26px 1fr;grid-template-rows:auto auto;
    gap:1px 7px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;
    border:1px solid var(--os-edge-lo);background:rgba(255,255,255,.04);text-align:left;
    transition:background var(--os-dur-fast) linear,border-color var(--os-dur-fast) linear,
               transform var(--os-dur) var(--os-spring)}
  .floor:hover{background:rgba(255,255,255,.09);transform:translateX(2px)}
  .floor[aria-current="true"]{border-color:var(--dm-active);background:rgba(245,158,11,.13)}
  .floor .fno{grid-row:1/3;font-family:var(--dm-font-mono);font-size:var(--dm-text-sm);
    color:var(--dm-fg-dim);text-align:center}
  .floor[aria-current="true"] .fno{color:var(--dm-active)}
  .floor .fname{font-size:var(--dm-text-2xs);letter-spacing:.06em;text-transform:uppercase;
    color:var(--dm-fg-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .floor .fdots{display:flex;gap:2px;flex-wrap:wrap}
  .fd{width:4px;height:4px;border-radius:999px;background:var(--dm-fg-dim);opacity:.45}
  .fd.work{background:var(--dm-active);opacity:1}
  .fd.live{background:var(--dm-ok);opacity:1}
  .fd.meet{background:#8b5cf6;opacity:1}
  .desks{flex:1;min-width:0;display:grid;gap:8px;align-content:start;
    grid-template-columns:repeat(auto-fill,minmax(112px,1fr));overflow:auto}
  .desk{position:relative;padding:8px 7px 7px;border-radius:9px;
    border:1px solid var(--os-edge-lo);background:rgba(255,255,255,.035);
    transition:transform var(--os-dur) var(--os-spring),background var(--os-dur-fast) linear}
  .desk:hover{transform:translateY(-2px);background:rgba(255,255,255,.08)}
  .desk .who{font-size:var(--dm-text-2xs);color:var(--dm-fg-body);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}
  .desk .st{font-size:8px;letter-spacing:.09em;text-transform:uppercase;margin-top:3px;
    color:var(--dm-fg-dim)}
  .desk.work .st{color:var(--dm-active)} .desk.live .st{color:var(--dm-ok)}
  .desk.meet{opacity:.35}                    /* seat is empty: they are in the meeting */
  .desk .av{width:16px;height:16px;border-radius:5px;margin-bottom:5px;
    background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
    border:1px solid var(--os-edge-hi)}
  .desk.work .av{background:linear-gradient(160deg,#f59e0b,#b45309)}
  .desk.live .av{background:linear-gradient(160deg,#10b981,#047857)}
  /* NAMED meetroom, not meet: `meet` is also the status modifier on .fd and
     .desk, and a bare `.meet` rule was styling every status dot as a 196px
     meeting room. A modifier and a component must never share a class name. */
  .meetroom{width:196px;flex:0 0 auto;padding:10px;display:flex;flex-direction:column;
    border-radius:var(--os-radius-widget);border:1px solid rgba(139,92,246,.42);
    background:rgba(139,92,246,.11);box-shadow:var(--os-elev-rest)}
  .meetroom-l{font-size:8px;letter-spacing:.14em;color:#c4b5fd;margin-bottom:7px}
  .meetroom-seats{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;flex:1}
  .seat{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
  .seat .av{width:16px;height:16px;border-radius:5px;
    background:linear-gradient(160deg,#a78bfa,#6d28d9);border:1px solid rgba(255,255,255,.22);
    animation:os-seat-in var(--os-dur-slow) var(--os-spring) both}
  .seat .nm{font-size:8px;color:#ddd6fe;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:52px}
  /* The sprite ARRIVES. The walk is the whole point of the office: it is
     how a fan-out reads as agents going somewhere rather than a list
     changing colour. Driven only by real events, never a timer. */
  @keyframes os-seat-in{from{opacity:0;transform:translate(-26px,16px) scale(.6)}
                        to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .seat .av{animation-duration:1ms} }
</style>
</head>
<body>
<div class="os-wallpaper" id="wall" data-wall="aurora" data-animated="true"></div>
<div id="walldim"></div>

<div class="os-menubar">
  <b>DOURMOUSE</b>
  <button class="os-btn" id="wallBtn" data-spec="Opens the wallpaper picker: four built-in gradients plus your own photo.">WALLPAPER</button>
  <span class="os-menubar-spacer"></span>
  <span data-spec="Live agent count from GET /api/roster. Green dot = all reachable.">&#9679; 49 agents</span>
  <span data-spec="Security risk score from the sentry. Click opens SECURITY.">&#9679; risk 21</span>
  <span id="clock" style="font-variant-numeric:tabular-nums"></span>
</div>

<div id="shell">
  <nav id="sidebar" aria-label="Screens"></nav>
  <section id="stage">
    <div id="stagebar">
      <span id="stagetitle">HOME</span>
      <span id="stagesub"></span>
      <span style="flex:1"></span>
      <div id="stageactions" style="display:flex;gap:8px"></div>
    </div>
    <div id="body"></div>
    <div class="composer" id="composer">
      <input class="os-field" id="cin" placeholder="Ask anything, or /all <goal> to put every resource on it"
             data-spec="Directive box. Enter sends, Shift+Enter newlines. Routes to THIS screen's own thread on the 7 thread-screens, otherwise falls back to HOME's.">
      <button class="os-btn os-btn--primary" data-spec="Sends the directive. Becomes a spinner while the run is in flight; the run can be cancelled from the stage bar.">SEND</button>
    </div>
  </section>
</div>

<div id="wallpicker" hidden>
  <div class="wp-head">Wallpaper</div>
  <div class="wp-grid">
    <button class="wp" data-wall="aurora" style="background:linear-gradient(135deg,#0d3a2c,#0a2a22)" data-spec="Aurora. The product's own canvas colour pushed to a horizon."></button>
    <button class="wp" data-wall="slate" style="background:linear-gradient(135deg,#1a2233,#0b0e14)" data-spec="Slate. Cooler, lower contrast, for long sessions."></button>
    <button class="wp" data-wall="ember" style="background:linear-gradient(135deg,#3a1f0c,#150b08)" data-spec="Ember. Warm, higher contrast."></button>
    <button class="wp" data-wall="mono" style="background:linear-gradient(135deg,#1a1a1c,#0a0a0b)" data-spec="Mono. Neutral, no hue, maximum text contrast."></button>
  </div>
  <label class="os-btn" style="width:100%;justify-content:center;margin-top:8px" data-spec="Pick any image from disk. It is read locally with FileReader and never uploaded: the bytes stay in this browser. Stored as a data URL against your profile.">
    UPLOAD PHOTO<input type="file" id="wallFile" accept="image/*" hidden>
  </label>
  <div class="wp-row">
    <span>Dim</span>
    <input type="range" id="wallDim" min="0" max="80" value="35"
      data-spec="Darkens the photo behind the UI. A real photo has arbitrary brightness, and body text needs 4.5:1 over whatever is behind it, so this is a readability control rather than a taste one.">
  </div>
  <div class="wp-row">
    <span>Motion</span>
    <button class="os-switch" id="wallAnim" role="switch" aria-checked="true" data-spec="The slow 46s parallax drift. Off automatically when the OS asks for reduced motion."></button>
  </div>
</div>

<div id="specbar">
  <button class="os-btn" id="specBtn" data-spec="Toggles this overlay. Keyboard: A.">SPEC</button>
  <span id="speclegend">press A to label every control</span>
</div>

<div class="os-dock" id="dock"></div>

<script>
(function(){
/* ------------------------------------------------------------------ *
   Screen definitions. Data, not markup, so twenty screens do not mean
   twenty copies of the same scaffolding. Each screen declares its own
   stage-bar actions and body. Everything a user can press carries a
   data-spec describing its real behaviour.
 * ------------------------------------------------------------------ */
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); };
function row(a,b,c){ return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'; }
function btn(label, spec, cls){ return '<button class="os-btn '+(cls||'')+'" data-spec="'+spec+'">'+label+'</button>'; }


/* One custom icon per screen. Stroke-based, 24x24, 1.5 weight, all drawn on
   the same grid so they read as one family rather than twenty borrowings.
   Each is a literal of what the screen does, never an abstract mark: a
   caret for the console, a shield for security, a flask for research. */
var ICON = {
 HOME:'M4 17l6-5-6-5M12 19h8',
 COMMS:'M3 6.5A1.5 1.5 0 014.5 5h15A1.5 1.5 0 0121 6.5v11a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5zM3.5 7l8.5 6 8.5-6',
 RESEARCH:'M9 3v5.5L4.5 17A2 2 0 006.3 20h11.4a2 2 0 001.8-3L15 8.5V3M8 3h8M7.5 14h9',
 CODE:'M8.5 8.5L5 12l3.5 3.5M15.5 8.5L19 12l-3.5 3.5M13.5 6l-3 12',
 VISION:'M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6zM12 9.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
 MEDIA:'M3 6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2zM10 9l5 3-5 3zM3 8h18',
 PROJECTS:'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 11h18',
 SETTINGS:'M12 9a3 3 0 110 6 3 3 0 010-6M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1',
 ATLAS:'M12 2a10 10 0 100 20 10 10 0 000-20M2 12h20M12 2c3 3.6 3 14.4 0 20M5 6c2 1.2 12 1.2 14 0M5 18c2-1.2 12-1.2 14 0',
 GLOBE:'M12 2a10 10 0 100 20 10 10 0 000-20M12 2c3.2 3.4 3.2 14.6 0 20M12 2c-3.2 3.4-3.2 14.6 0 20M2.5 9h19M2.5 15h19',
 NEWS:'M4 5h13v14H5a1 1 0 01-1-1zM17 9h3v8a2 2 0 01-2 2M7 8.5h7M7 12h7M7 15.5h4',
 DESIGN3D:'M12 2.5l8.5 4.9v9.2L12 21.5 3.5 16.6V7.4zM12 2.5v19M3.5 7.4l8.5 4.9 8.5-4.9',
 VOICE:'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3M5.5 11.5a6.5 6.5 0 0013 0M12 18v3M9 21h6',
 ORCHESTRATION:'M12 3.5a2 2 0 110 4 2 2 0 010-4M5 16.5a2 2 0 110 4 2 2 0 010-4M19 16.5a2 2 0 110 4 2 2 0 010-4M12 7.5v4M12 11.5l-6 5M12 11.5l6 5',
 GOALS:'M12 2.5a9.5 9.5 0 100 19 9.5 9.5 0 000-19M12 7a5 5 0 100 10 5 5 0 000-10M12 11a1 1 0 110 2 1 1 0 010-2',
 TIMETABLE:'M4 6a2 2 0 012-2h12a2 2 0 012 2v13a1 1 0 01-1 1H5a1 1 0 01-1-1zM4 9h16M8 3v4M16 3v4M8 13h3M8 16.5h6',
 AGENTSMITH:'M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7zM12 14.5v6M9 20.5h6',
 WIKI:'M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5zM20 19v2H6.5M8 7.5h8M8 11h8M8 14.5h5',
 SECURITY:'M12 2.8l7.5 3.1v6c0 4.4-3.1 7.6-7.5 9.3-4.4-1.7-7.5-4.9-7.5-9.3v-6zM9 12l2.2 2.2L15.5 10',
 OFFICE:'M3 20.5h18M5 20.5V9l7-5 7 5v11.5M9.5 20.5V15h5v5.5M9 11h1.5M13.5 11H15'
};

/* The real 43-agent floor map, verified against a live build_general_registry()
   call rather than invented. Status values are the four the ActivityTracker
   genuinely reports. */
var OFFICE_FLOORS = [
 { name:'Executive &amp; Ops', agents:[['orchestrator','work'],['comms','idle'],['companion','idle'],
   ['admin_ops','idle'],['scheduling','idle'],['tasks','idle'],['goals','work'],['system','live'],
   ['memory','idle'],['messenger','idle'],['docs','idle']] },
 { name:'Research &amp; Intel', agents:[['research_info','meet'],['research_mesh','idle'],
   ['evidence_pipeline','idle'],['device_wiki','idle'],['study','idle'],['worldmonitor','live'],
   ['globe','idle'],['news','live'],['rnd','meet']] },
 { name:'Trust &amp; Security', agents:[['security','meet'],['reviewer','idle'],['agent_smith','idle']] },
 { name:'Engineering', agents:[['dev_coding','work'],['code_claude','idle'],['code_codex','idle'],
   ['code_deepseek','idle'],['code_nvidia','idle'],['code_ollama','idle'],['compute','idle'],
   ['browser','work'],['panel_control','idle'],['apps','idle'],['design_3d','idle']] },
 { name:'Finance &amp; Media', agents:[['forex','idle'],['freebuff','idle'],['google_workspace','idle'],
   ['markets','live'],['media','idle'],['music','idle'],['mt5','idle'],['t212','idle']] },
 /* The Lounge is the 43rd agent and it is NOT a spare floor. mail is an
    always-on poller (every 300s), so it belongs to no team and is shown
    regardless of which floor is open. Dropping it silently would have made
    the building show 42 of 43 agents, which is exactly the kind of quiet
    undercount this project keeps finding in its own stale comments. */
 { name:'Lounge', agents:[['mail','live']] },
];

var SCREENS = {
HOME: { sub:'central agent dispatch', live:1, composer:true,
  actions:[ btn('NEW THREAD','Clears the visible thread and starts a fresh session file. The old one stays on disk and is resumable.'),
            btn('AUTONOMOUS','Opt-in: raises this turn\'s step ceiling from 8 to the Phase 5 autonomous limit. Still bounded by the governance budget.','') ],
  body:
   '<div class="turn"><div class="who">You</div><div class="you">play the verification clip and show me the security dashboard</div></div>'+
   '<div class="turn"><div class="who">Dourmouse &middot; 2 steps &middot; 2.4s</div>'+
   '<span class="tag" data-spec="Tool chip. Click expands the real arguments and the real result. Never a summary.">&#9670; open_file_preview</span>'+
   '<span class="tag">&#9670; security_dashboard</span>'+
   '<div class="muted" style="margin-top:8px;color:var(--dm-fg-body)">Opened the clip in the embedded player and pulled the current dashboard. Risk score is <b style="color:var(--dm-active)">21</b> with four findings open, the highest being the Application Firewall reporting disabled.</div>'+
   '<div style="margin-top:8px;display:flex;gap:8px">'+
   btn('COPY','Copies the raw reply text to the clipboard.')+
   btn('REGENERATE','Re-runs the same directive on a fresh turn. The previous answer stays in the transcript.')+
   btn('SHELVE','Moves this turn out of the active context window without deleting it.')+'</div></div>'+
   '<div class="turn"><div class="who">You</div><div class="you">which of those four is worth acting on tonight</div></div>'+
   '<div class="turn"><div class="who">Dourmouse &middot; 1 step &middot; 0.9s</div>'+

         'data-spec="Floor '+(i+1)+', '+f.name+'. '+f.agents.length+' agents. Click to open this floor. '+
         'The dot count is how many are doing something right now.">'+
         '<span class="fno">F'+(i+1)+'</span>'+
         '<span class="fname">'+f.name+'</span>'+
         '<span class="fdots">'+f.agents.map(function(a){
            return '<i class="fd '+a[1]+'"></i>'; }).join('')+'</span>'+
       '</button>';
     }).join('')+
   '</div>'+
   /* the floor itself */
   '<div class="card" style="flex:1;min-width:0;display:flex;flex-direction:column;padding:10px">'+
     '<div class="lbl" id="floorname" style="margin-bottom:8px">Research &amp; Intel</div>'+
     '<div style="flex:1;min-height:0;display:flex;gap:10px">'+
       '<div id="desks" class="desks"></div>'+
       '<div class="meetroom" data-spec="Meeting room. An agent walks here when it joins a real '+
         'delegate_parallel fan-out and walks back when its branch returns. Driven only by real '+
         'events, never a timer, so an empty room means nothing is fanned out.">'+
         '<div class="meetroom-l">MEETING ROOM</div><div class="meetroom-seats" id="seats"></div></div>'+
     '</div>'+
   '</div></div>' },
};


var ORDER = ["HOME","COMMS","RESEARCH","CODE","VISION","MEDIA","PROJECTS","SETTINGS","ATLAS","GLOBE","NEWS","DESIGN3D","VOICE","ORCHESTRATION","GOALS","TIMETABLE","AGENTSMITH","WIKI","SECURITY","OFFICE"];

var DOCK = [
  ['HOME','Console','M4 17l6-5-6-5 M12 19h8'],
  ['OFFICE','Agents','M12 5a3 3 0 110 6 3 3 0 010-6 M5.5 20a6.5 6.5 0 0113 0'],
  ['RESEARCH','Research','M11 5a6 6 0 110 12 6 6 0 010-12 M20 20l-4.5-4.5'],
  ['SECURITY','Security','M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z'],
  ['GLOBE','Browser','M12 3a9 9 0 110 18 9 9 0 010-18 M3 12h18 M12 3c3 3.5 3 14 0 18-3-4-3-14.5 0-18z'],
  ['MEDIA','Media','M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z M10 9l5 3-5 3z'],
  ['WIKI','Wiki','M4 5.5A2.5 2.5 0 016.5 3H20v16H6.5A2.5 2.5 0 004 21.5z'],
  ['GOALS','Goals','M12 3v18 M5 8l7-5 7 5'],
  ['SETTINGS','Settings','M12 9a3 3 0 110 6 3 3 0 010-6 M12 3v3 M12 18v3 M3 12h3 M18 12h3']
];

var cur = 'HOME';

function renderNav(){
  document.getElementById('sidebar').innerHTML = ORDER.map(function(k){
    var s = SCREENS[k];
    return '<button class="navitem" data-go="'+k+'" data-live="'+(s.live?1:0)+'" '+
      'aria-current="'+(k===cur)+'" data-spec="Switches the stage to '+k+'. '+
      (['HOME','RESEARCH','CODE','MEDIA','NEWS','DESIGN3D','COMMS'].indexOf(k)>=0
        ? 'Has its own independent thread.' : 'Directives typed here fall back to HOME\'s thread.')+'">'+
      '<svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" '+
      'stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON[k]+'"/></svg>'+
      '<span style="flex:1">'+k+'</span><i class="nd"></i></button>';
  }).join('');
}
function renderDock(){
  document.getElementById('dock').innerHTML = DOCK.map(function(d){
    return '<button class="os-dock-item" data-go="'+d[0]+'" data-running="'+(SCREENS[d[0]].live?'true':'false')+'" '+
      'aria-label="'+d[1]+'" data-spec="Opens '+d[0]+'. The dot means that surface has something live running.">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" '+
      'stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON[d[0]]+'"/></svg>'+
      '<span class="os-dock-label">'+d[1]+'</span></button>';
  }).join('') + '<div class="os-dock-sep"></div>' +
  '<button class="os-dock-item" data-spec="Notification centre. Collects every alert the desktop notifier raised, with read state. Not built yet: item OS-8." aria-label="Alerts">'+
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg>'+
  '<span class="os-dock-label">Alerts</span></button>';
}
function paintFloor(i){
  var f = OFFICE_FLOORS[i];
  var fn = document.getElementById('floorname'); if(!fn) return;
  fn.innerHTML = f.name;
  document.querySelectorAll('.floor').forEach(function(b){
    b.setAttribute('aria-current', String(Number(b.dataset.floor) === i));
  });
  document.getElementById('desks').innerHTML = f.agents.map(function(a){
    var label = a[1]==='meet' ? 'in meeting' : a[1]==='work' ? 'working'
              : a[1]==='live' ? 'live' : 'idle';
    return '<div class="desk '+a[1]+'" data-spec="'+a[0]+'. Click opens this agent\'s live '+
      'reasoning stream, tagged by call_id so two concurrent runs never merge.">'+
      '<div class="av"></div><div class="who">'+a[0]+'</div>'+
      '<div class="st">'+label+'</div></div>';
  }).join('');
  var inMeeting = f.agents.filter(function(a){ return a[1]==='meet'; });
  document.getElementById('seats').innerHTML = inMeeting.length
    ? inMeeting.map(function(a){
        return '<div class="seat"><div class="av"></div><div class="nm">'+a[0]+'</div></div>'; }).join('')
    : '<div style="font-size:8px;color:#a78bfa;opacity:.6;align-self:center">no fan-out running</div>';
}

function show(k){
  if(!SCREENS[k]) return;
  cur = k; var s = SCREENS[k];
  document.getElementById('stagetitle').textContent = k;
  document.getElementById('stagesub').innerHTML = s.sub || '';
  document.getElementById('stageactions').innerHTML = (s.actions||[]).join('');
  document.getElementById('body').innerHTML = s.body || '<div class="empty">Nothing here yet.</div>';
  document.getElementById('composer').style.display = s.composer ? 'flex' : 'none';
  // Update the SELECTION, never re-render the nav. Rebuilding innerHTML on
  // every screen change destroys the element the user is currently pressing
  // (found for real: a scripted click timed out because the button was
  // replaced mid-click), throws away focus, and makes the sidebar flicker.
  // A real window manager moves a highlight; it does not rebuild its dock.
  document.querySelectorAll('#sidebar .navitem').forEach(function(n){
    n.setAttribute('aria-current', String(n.dataset.go === k));
  });
  if(k === 'OFFICE') paintFloor(1);
}
document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if(g){ show(g.dataset.go); return; }
  var fl = e.target.closest('.floor');
  if(fl){ paintFloor(Number(fl.dataset.floor)); return; }
  var sw = e.target.closest('.os-switch');
  if(sw){ sw.setAttribute('aria-checked', sw.getAttribute('aria-checked')==='true'?'false':'true'); return; }
  var seg = e.target.closest('.os-seg button');
  if(seg){ [].forEach.call(seg.parentNode.children, function(b){ b.setAttribute('aria-selected','false'); });
           seg.setAttribute('aria-selected','true'); return; }
  if(e.target.closest('#specBtn')){ toggleSpec(); return; }
  if(e.target.closest('#wallBtn')){
    var pk=document.getElementById('wallpicker'); pk.hidden=!pk.hidden;
    document.getElementById('wallBtn').classList.toggle('is-on', !pk.hidden); return;
  }
  var wp = e.target.closest('.wp');
  if(wp){
    var el=document.getElementById('wall');
    el.style.backgroundImage=''; el.dataset.wall=wp.dataset.wall;
    document.querySelectorAll('.wp').forEach(function(b){ b.setAttribute('aria-current', String(b===wp)); });
    try{ localStorage.setItem('dm.wall', wp.dataset.wall); localStorage.removeItem('dm.wallPhoto'); }catch(_){}
    return;
  }
  if(!e.target.closest('#wallpicker') && !e.target.closest('#wallBtn')){
    var pk2=document.getElementById('wallpicker');
    if(pk2 && !pk2.hidden){ pk2.hidden=true; document.getElementById('wallBtn').classList.remove('is-on'); }
  }
});
function toggleSpec(){
  var on = document.body.dataset.annotate === 'true';
  document.body.dataset.annotate = on ? 'false' : 'true';
  document.getElementById('specBtn').classList.toggle('is-on', !on);
  document.getElementById('speclegend').textContent = on
    ? 'press A to label every control' : 'every control is labelled with what it does';
}
document.addEventListener('keydown', function(e){
  if(e.key==='a'||e.key==='A'){ if(document.activeElement.tagName!=='INPUT') toggleSpec(); }
});
function tick(){
  var d=new Date(), c=document.getElementById('clock');
  if(c) c.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// Wallpaper: a real local photo, read with FileReader so the bytes never
// leave this machine. Persisted as a data URL. A file too large for
// localStorage fails honestly rather than silently dropping the choice.
var wallFile = document.getElementById('wallFile');
if(wallFile) wallFile.addEventListener('change', function(){
  var f = this.files && this.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var el = document.getElementById('wall');
    el.style.backgroundImage = 'url('+r.result+')';
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.dataset.wall = 'photo';
    document.querySelectorAll('.wp').forEach(function(b){ b.setAttribute('aria-current','false'); });
    try { localStorage.setItem('dm.wallPhoto', r.result); }
    catch(err){
      // Real, named failure: a multi-megabyte photo exceeds the localStorage
      // quota. The wallpaper still applies for this session; only the
      // remembering fails, and saying so beats pretending it saved.
      var lg = document.getElementById('speclegend');
      if(lg) lg.textContent = 'photo applied, too large to remember across restarts';
    }
  };
  r.readAsDataURL(f);
});
var dim = document.getElementById('wallDim');
if(dim) dim.addEventListener('input', function(){
  document.getElementById('walldim').style.opacity = String(this.value/100);
  try{ localStorage.setItem('dm.wallDim', this.value); }catch(_){}
});
var anim = document.getElementById('wallAnim');
if(anim) anim.addEventListener('click', function(){
  var on = this.getAttribute('aria-checked')==='true';
  document.getElementById('wall').dataset.animated = String(!on);
});
// Restore a remembered choice.
try {
  var savedPhoto = localStorage.getItem('dm.wallPhoto');
  var savedWall  = localStorage.getItem('dm.wall');
  var savedDim   = localStorage.getItem('dm.wallDim');
  var wEl = document.getElementById('wall');
  if(savedPhoto){ wEl.style.backgroundImage='url('+savedPhoto+')';
    wEl.style.backgroundSize='cover'; wEl.style.backgroundPosition='center'; wEl.dataset.wall='photo'; }
  else if(savedWall){ wEl.dataset.wall = savedWall; }
  if(savedDim){ document.getElementById('walldim').style.opacity=String(savedDim/100);
    document.getElementById('wallDim').value = savedDim; }
  document.querySelectorAll('.wp').forEach(function(b){
    b.setAttribute('aria-current', String(!savedPhoto && b.dataset.wall===(savedWall||'aurora')));
  });
} catch(_){}

tick(); setInterval(tick, 10000);
// Render the chrome ONCE. show() only moves the selection after this.
renderNav(); renderDock();
show('HOME');
})();
</script>
</body>
</html>
