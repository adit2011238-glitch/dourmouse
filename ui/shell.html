<!DOCTYPE html>
<html lang="en" data-shell="os">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOURMOUSE</title>
  <!-- The shell (finding #143, rebuilt as a Mac window in finding #194). Thin on purpose: PWA head
       tags, the window skeleton and ONE module script. There is no inline script, no inline event
       handler and no importmap, because the server sends this page with script-src 'self': the
       page can approve actions (POST /api/confirm), so injected script would be a way to approve
       an attacker's request. macOS draws the window frame, the traffic lights and the menu bar. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dourmouse">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
<link rel="stylesheet" href="/assets/dourmouse-ui.css">
<link rel="stylesheet" href="/assets/dourmouse-os.css">
<link rel="stylesheet" href="/assets/os/kit/kit.css">
<link rel="stylesheet" href="/assets/os/palette.css">
<link rel="stylesheet" href="/assets/os/tokens.css">
<link rel="stylesheet" href="/assets/os/shell.css">
<link rel="modulepreload" href="/assets/os/boot.js">
<link rel="modulepreload" href="/assets/os/core/api.js">
<link rel="modulepreload" href="/assets/os/core/events.js">
<link rel="modulepreload" href="/assets/os/core/chat.js">
<link rel="modulepreload" href="/assets/os/core/approvals.js">
<link rel="modulepreload" href="/assets/os/core/scope.js">
<link rel="modulepreload" href="/assets/os/core/prefs.js">
<link rel="modulepreload" href="/assets/os/core/appearance.js">
<link rel="modulepreload" href="/assets/os/core/wallpaper.js">
<link rel="modulepreload" href="/assets/os/core/commands.js">
<link rel="modulepreload" href="/assets/os/core/keymap.js">
<link rel="modulepreload" href="/assets/os/core/ring.js">
<link rel="modulepreload" href="/assets/os/core/host.js">
<link rel="modulepreload" href="/assets/os/core/registry.js">
<link rel="modulepreload" href="/assets/os/core/router.js">
<link rel="modulepreload" href="/assets/os/core/ctx.js">
<link rel="modulepreload" href="/assets/os/kit/html.js">
<link rel="modulepreload" href="/assets/os/kit/states.js">
</head>
<body>
<button type="button" class="skip-link" id="skipLink">Skip to content</button>
<!-- the owner's own wallpaper (core/wallpaper.js); empty and transparent until a photo is chosen -->
<div id="wall" aria-hidden="true" data-wall="none"></div>

<div id="palette" role="dialog" aria-modal="true" aria-label="Search" hidden></div>

<div id="shell" data-sidebar="shown" data-inspector="hidden">
  <nav id="sidebar" aria-label="Places"></nav>
  <main id="stage" aria-label="Content">
    <div id="stagebar" data-drag>
      <div id="tbLead"></div>
      <h1 id="stagetitle" tabindex="-1">Home</h1>
      <div id="viewswitch" class="segs" role="navigation" hidden></div>
      <span id="stagesub"></span>
      <span class="grow"></span>
      <div id="stageactions"></div>
      <div id="tbTrail"></div>
    </div>
    <div id="stagebanner" role="region" aria-label="Finish signing in" hidden></div>
    <div id="body"></div>
    <div class="composer" id="composer" hidden></div>
  </main>
  <aside id="inspector" aria-label="Inspector" hidden></aside>
</div>

<div id="sheetlayer" hidden></div>
<div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/assets/os/boot.js" data-sw="/sw.js"></script>
</body>
</html>
