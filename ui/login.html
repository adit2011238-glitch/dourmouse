<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOURMOUSE // ACCESS GATE</title>
<style>
  :root {
    /* ---- JARVIS Scene Archive & Design System · palette ---- */
    --ground: #0B0E14;
    --surface: #12151E;
    --cyan:  #4FC3F7; --cyan-rgb:  79,195,247;
    --amber: #F5A623; --amber-rgb: 245,166,35;
    --red:   #EF5350; --red-rgb:   239,83,80;
    --gold:  #FFD232; --gold-rgb:  255,210,50;
    --dead:  #8A929E; --dead-rgb:  138,146,158;
    --a06: 0.06; --a10: 0.10; --a16: 0.16; --a22: 0.22;
    --a30: 0.30; --a45: 0.45; --a60: 0.60; --a85: 0.85;
    /* ---- type ---- */
    --font-display:  "Exo 2","Avenir Next","Helvetica Neue",Arial,sans-serif;
    --font-mono:     "JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --font-prose:    "Inter",-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    --font-wordmark: "Orbitron","Exo 2","Avenir Next",sans-serif;
    /* ---- semantic aliases ---- */
    --text: rgba(var(--cyan-rgb), var(--a85));
    --text-dim: rgba(var(--cyan-rgb), var(--a45));
    --line: rgba(var(--cyan-rgb), var(--a10));
    --line-strong: rgba(var(--cyan-rgb), var(--a30));
    --panel: rgba(18,21,30,0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 480px at 70% -10%, rgba(var(--cyan-rgb), 0.14), transparent 60%),
      linear-gradient(rgba(var(--cyan-rgb), var(--a06)) 1px, transparent 1px) 0 0 / 34px 34px,
      var(--ground);
    color: var(--text);
    font-family: var(--font-mono);
    display: flex; align-items: center; justify-content: center;
  }
  .gate {
    width: min(92vw, 420px);
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(10px);
    padding: 34px 30px;
    position: relative;
    box-shadow: 0 0 60px rgba(var(--cyan-rgb), var(--a10));
  }
  .gate::before, .gate::after {
    content: ""; position: absolute; width: 18px; height: 18px;
    border: 1px solid var(--cyan); opacity: .50;
  }
  .gate::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .gate::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  h1 {
    font-family: var(--font-wordmark); font-weight: 400;
    font-size: 15px; letter-spacing: 0.30em; margin-left: 0.30em; color: var(--text);
    text-shadow: 0 0 16px rgba(var(--cyan-rgb), var(--a45)), 0 0 50px rgba(var(--cyan-rgb), var(--a22)); margin-bottom: 8px;
  }
  p.sub { font-size: 10px; font-weight: 300; color: var(--text-dim); margin-bottom: 26px; line-height: 1.6; }
  label { display: block; font-size: 9px; letter-spacing: 0.13em; font-weight: 400; color: var(--text-dim); margin-bottom: 8px; }
  input {
    width: 100%; background: rgba(11,14,20,0.9); border: 1px solid var(--line);
    color: var(--text); font-family: var(--font-mono); font-size: 14px; font-weight: 300;
    padding: 12px 14px; letter-spacing: 0.08em; outline: none;
  }
  input:focus { border-color: rgba(var(--cyan-rgb), var(--a45)); }
  button {
    width: 100%; margin-top: 18px; padding: 12px; cursor: pointer;
    background: rgba(var(--cyan-rgb), var(--a16));
    border: 1px solid rgba(var(--cyan-rgb), var(--a30)); color: var(--text);
    font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.13em;
    transition: all .2s;
  }
  button:hover { background: rgba(var(--cyan-rgb), var(--a22)); }
  #msg { margin-top: 14px; font-size: 10px; min-height: 16px; color: var(--red); }
  .ok { color: var(--text) !important; }
</style>
</head>
<body>
  <div class="gate">
    <h1>DOURMOUSE // ACCESS GATE</h1>
    <p class="sub">This command centre is protected. Enter the access token from
      <span style="color:var(--text)">DOURMOUSE_ACCESS_TOKEN</span> in the server's
      <span style="color:var(--text)">.env</span> to continue.</p>
    <label for="tok">ACCESS TOKEN</label>
    <input id="tok" type="password" autocomplete="current-password" autofocus spellcheck="false">
    <button id="go">AUTHENTICATE ▸</button>
    <div id="msg"></div>
  </div>
<script>
  const msg = document.getElementById('msg');
  const tok = document.getElementById('tok');
  async function attempt() {
    msg.textContent = ''; msg.className = '';
    const token = tok.value.trim();
    if (!token) { msg.textContent = '// TOKEN REQUIRED'; return; }
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token }),
      });
      const body = await r.json().catch(() => ({}));
      if (r.ok && body.ok) { location.href = '/'; return; }
      if (body.enabled === false) { msg.className = 'ok'; msg.textContent = '// NO TOKEN CONFIGURED — PROCEED'; setTimeout(() => location.href='/', 600); return; }
      msg.textContent = '// ACCESS DENIED — INVALID TOKEN';
    } catch (e) { msg.textContent = '// NETWORK ERROR: ' + e; }
  }
  document.getElementById('go').addEventListener('click', attempt);
  tok.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
</script>
</body>
</html>
