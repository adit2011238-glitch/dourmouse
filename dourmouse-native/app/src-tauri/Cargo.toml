[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real HTTP client to the existing Python backend (dourmouse/webui.py,
# unchanged) -- the native shell is a NEW client of the SAME real
# server, not a second backend. See lib.rs's own comment.
# v13.6: "stream" feature added for a real SSE client against
# GET /api/events (item 7's own flagged gap: real push, not a 2s poll) --
# see start_activity_stream in lib.rs.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# Tauri already runs on tokio internally (tauri::async_runtime); this
# direct dependency is only for tokio::time::sleep's backoff delay in
# start_activity_stream's reconnect loop.
tokio = { version = "1", features = ["time"] }

