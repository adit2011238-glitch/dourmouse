[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "dourmouse-native",
    "atlas_terminal",
    "gods-eye-view",
    "jarvis",
    "electron-claude-bridge",
    "supabase",
    "workspace",
    "data",
    "logs",
    "training",
    "training_config",
    "training_data",
]

[tool.ruff.lint]
# A curated set, not ruff's full default/preview catalogue (that ran to
# 1,354 findings dominated by noise for this codebase's real style -- e.g.
# EXE002 "shebang missing executable bit" fired 296 times on library
# modules never meant to be invoked directly). Real signal only:
select = [
    "F",      # pyflakes -- undefined names, unused imports/variables, real correctness
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # import sorting (mechanical, safe to autofix)
    "B",      # flake8-bugbear -- real common-mistake patterns
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit -- security-shaped patterns (subprocess, etc.)
    "PLW1510",  # subprocess.run without an explicit check= (real, relevant to the shell/subprocess audit)
]
ignore = [
    "E501",    # line length is a formatter's job, not a lint gate, at this codebase's own long-line-tolerant style
    "S101",    # assert is used deliberately throughout the real test suite
    "S603",    # subprocess call - this codebase already reviews call sites individually (docs/ENGINEERING_AUDIT.md); the real, valuable subset is PLW1510
    "S607",    # partial-path process call - matches this codebase's existing convention of calling system tools by name
    "B008",    # function-call-in-default-argument -- FastAPI-style patterns aren't used here, but a few real call sites rely on this deliberately
]

[tool.ruff.lint.per-file-ignores]
# Test doubles/fixtures legitimately do things production code shouldn't.
# F811 in tests is the pytest cross-file-fixture pattern (import a fixture
# by name, then use that exact name as a test's own parameter -- always
# intentional, never a real shadowing bug; audited individually 2026-09-17
# before adding this, see docs/ENGINEERING_AUDIT.md).
"dourmouse/tests/*" = ["S", "B011", "F811"]
