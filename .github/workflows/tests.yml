name: dourmouse suite

on:
  push:
    branches: [main]
  pull_request:

# Phase 0.4 (COMMERCIAL_CHECKLIST): the suite is the product's honesty
# engine — it must pass on every OS before anything ships. As of 731b1dd
# the suite is 100% green on Windows (1024 passed / 0 failed) and was
# proven green on macOS; this matrix enforces that on every push.
jobs:
  dourmouse-suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash  # POSIX syntax everywhere (Git Bash on Windows)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r requirements-extract.txt  # extract tests need pypdf
          pip install pywebview  # desktop tests touch the bridge module

      - name: Run the suite
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest dourmouse/tests -q --tb=short

      - name: Confirm zero failures
        run: |
          python -m pytest dourmouse/tests -q --tb=no > _ci_last.txt 2>&1 || true
          if grep -q "FAILED\|ERROR" _ci_last.txt; then echo "CI BLOCKED: suite not fully green"; exit 1; fi
          echo "OK: $(grep -oE '[0-9]+ passed' _ci_last.txt | tail -1)"
