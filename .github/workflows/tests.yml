name: dourmouse CI

# Finding #085. This workflow used to trigger only on `main` and PRs, while
# every commit lands on the working branch, so it had never once run on the
# code actually being built; its last runs (2026-08-13, on main) were red and
# nobody saw. It also pinned Python 3.11 while development runs 3.14, and ran
# the whole suite twice (the second run only grepped the first's output).

on:
  push:
    branches: [main, recon-2026-09-11]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ratchet:
    name: lint ratchet (ruff + mypy may only go down)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ratchet
        run: python scripts/lint_ratchet.py

  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash  # POSIX syntax everywhere (Git Bash on Windows)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r requirements-extract.txt  # extract tests need pypdf
      - name: Run the suite
        env:
          PYTHONIOENCODING: utf-8
        # pytest's own exit code is the gate: non-zero on any failure or error.
        run: python -m pytest dourmouse/tests -q --tb=short
